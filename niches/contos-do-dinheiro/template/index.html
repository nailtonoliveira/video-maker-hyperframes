<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ink","type":"color","label":"Traço","default":"#2a2320"},
    {"id":"gold","type":"color","label":"Ouro (dinheiro)","default":"#f2b134"},
    {"id":"paper","type":"color","label":"Papel das placas","default":"#fff6e3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit/base.js"></script>
    <script src="assets/kit/pessoas.js"></script>
    <script src="assets/kit/natureza.js"></script>
    <script src="assets/kit/dinheiro.js"></script>
    <script src="assets/kit/papelaria.js"></script>
    <script src="assets/kit/casa.js"></script>
    <script src="assets/kit/comercio.js"></script>
    <script src="assets/kit/tribunal.js"></script>
    <script src="assets/kit/palco-cozinha.js"></script>
    <script src="assets/kit/palco-rua.js"></script>
    <script src="assets/kit/palco-loja.js"></script>
    <script src="assets/kit/palco-tribunal.js"></script>
    <script src="assets/kit/palco-praca.js"></script>
    <script src="assets/kit/episodio.js"></script>
    <style>
      :root {
        --ink: #2a2320;
        --gold: #f2b134;
        --paper: #fff6e3;
        --font: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbe8c8;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- EXEMPLO DO TEMPLATE: 3 cenas que mostram o padrão (palco pronto, câmera perto). Duração = voz + cartão final (6 s). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="79.94" data-width="1080" data-height="1920">
      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html"
        data-start="0" data-duration="12" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="conversa" data-composition-id="conversa" data-composition-src="compositions/conversa.html"
        data-start="12" data-duration="18" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="revelacao" data-composition-id="revelacao" data-composition-src="compositions/revelacao.html"
        data-start="30" data-duration="49.94" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="aviso" data-composition-id="aviso" data-composition-src="compositions/aviso.html"
        data-start="79.94" data-duration="6" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Legendas (geradas por tools/build_captions.py, estilo story-pop) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="79.94" data-track-index="1" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <audio id="voz" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="2" data-volume="1"></audio>
      <audio id="musica" class="clip" src="assets/audio/musica.wav" data-start="0" data-track-index="3" data-volume="0.16"></audio>
      <audio id="efeitos" class="clip" src="assets/audio/efeitos.wav" data-start="0" data-track-index="4" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
