<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ink","type":"color","label":"Traço","default":"#2a2320"},
    {"id":"gold","type":"color","label":"Ouro (dinheiro)","default":"#f2b134"},
    {"id":"paper","type":"color","label":"Papel das placas","default":"#fff6e3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      :root {
        --ink: #2a2320;
        --gold: #f2b134;
        --paper: #fff6e3;
        --font: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbe8c8;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- 002 · A nota que encolheu. Duração = locução (79,94 s) + cartão final (6 s). Quem narra é a nota. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="79.94" data-width="1080" data-height="1920">
      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html"
        data-start="0" data-duration="5.55" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="guardar" data-composition-id="guardar" data-composition-src="compositions/guardar.html"
        data-start="5.55" data-duration="15.05" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="precos" data-composition-id="precos" data-composition-src="compositions/precos.html"
        data-start="20.6" data-duration="23.15" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="aniversario" data-composition-id="aniversario" data-composition-src="compositions/aniversario.html"
        data-start="43.75" data-duration="10.25" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="mercado" data-composition-id="mercado" data-composition-src="compositions/mercado.html"
        data-start="54" data-duration="11.05" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="moral" data-composition-id="moral" data-composition-src="compositions/moral.html"
        data-start="65.05" data-duration="8.1" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html"
        data-start="73.15" data-duration="6.79" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="aviso" data-composition-id="aviso" data-composition-src="compositions/aviso.html"
        data-start="79.94" data-duration="6" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Legendas (geradas por tools/build_captions.py, estilo story-pop) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="79.94" data-track-index="1" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <audio id="voz" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="2" data-volume="1"></audio>
      <audio id="musica" class="clip" src="assets/audio/musica.wav" data-start="0" data-track-index="3" data-volume="0.16"></audio>
      <audio id="efeitos" class="clip" src="assets/audio/efeitos.wav" data-start="0" data-track-index="4" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
