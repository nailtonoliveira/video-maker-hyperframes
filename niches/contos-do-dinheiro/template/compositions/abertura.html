<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #ab-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 0–5,55 s · Gancho: a nota de R$ 100 na lata encolhe para o que vale hoje (R$ 41). Quadro 0 = último quadro do vídeo. -->
  <div id="root" data-composition-id="abertura" data-width="1080" data-height="1920">
    <svg id="ab-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="ab-cam"><g id="ab-mundo"></g></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C;
      // Mesmo quadro do fim do vídeo (final.html): mesa, lata aberta, nota grande, placa R$ 100.
      document.getElementById("ab-mundo").innerHTML = `
        <rect x="0" y="0" width="1080" height="1920" fill="#fbe8c8"/>
        <rect x="0" y="1060" width="1080" height="140" fill="#f1d3a1"/>
        <rect x="-20" y="1180" width="1120" height="780" fill="#c08552" stroke="${C.ink}" stroke-width="5"/>
        <rect x="-20" y="1180" width="1120" height="30" fill="#a86f42"/>
        <g transform="translate(540,1180) scale(1.5)">${K.tin("ab-lata")}</g>
        <rect id="ab-fant" x="210" y="655" width="660" height="330" rx="27" fill="none" stroke="${C.ink}" stroke-width="5" stroke-dasharray="18 14" opacity="0"/>
        <g transform="translate(540,820)"><g id="ab-nota-wrap">${K.note("ab-nota")}</g></g>
        <g transform="translate(540,330)">${K.sign("ab-placa", [["R$ 100", 104, C.ink, "ab-valor"]], { w: 560 })}</g>
        <g transform="translate(540,470)">${K.sign("ab-tag", [["PODER DE COMPRA HOJE", 34, "#fff"]], { w: 500, bg: C.red, nails: false })}</g>
        <g transform="translate(540,1080) rotate(-6)">${K.sign("ab-selo", [["GUARDADA DESDE 2010", 40, "#fff"]], { w: 560, bg: "#3d5a80", nails: false })}</g>`;

      const tl = gsap.timeline({ paused: true });
      // Estado do quadro 0 (= último quadro do vídeo)
      gsap.set("#ab-nota-body", { scale: 1.5, transformOrigin: "50% 50%" });
      tl.set("#ab-nota-body", { scale: 1.5, transformOrigin: "50% 50%" }, 0);
      gsap.set("#ab-lata-lid", { y: -140, opacity: 0 });
      tl.set("#ab-lata-lid", { y: -140, opacity: 0 }, 0);
      gsap.set(["#ab-tag", "#ab-selo"], { opacity: 0 });
      tl.set(["#ab-tag", "#ab-selo"], { opacity: 0 }, 0);
      tl.fromTo("#ab-cam", { scale: 1, svgOrigin: "540 820" }, { scale: 1.06, duration: 5.5, ease: "none" }, 0);
      // A nota fala (boca abre e fecha nas palavras)
      const fala = (a, b) => { for (let s = a; s < b - 0.1; s += 0.36) { K.mouth(tl, "ab-nota", "open", s); K.mouth(tl, "ab-nota", "smile", s + 0.18); } };
      fala(0.0, 1.1);
      // "Hoje, valho quarenta e um": encolhe para 0,41 do tamanho, a placa corre até R$ 41
      tl.set("#ab-fant", { opacity: 0.8 }, 1.78);
      tl.to("#ab-nota-body", { scale: 1.5 * 0.4076, duration: 0.9, ease: "power3.inOut" }, 1.78);
      K.counter(tl, "#ab-valor", 100, 41, 1.78, 0.96);
      tl.set("#ab-valor", { fill: C.red }, 1.78);
      tl.set("#ab-tag", { opacity: 1 }, 2.0);
      K.pop(tl, "#ab-tag-in", 2.0);
      K.mouth(tl, "ab-nota", "flat", 2.7);
      // "E ninguém NUNCA me gastou"
      tl.set("#ab-selo", { opacity: 1 }, 3.6);
      tl.fromTo("#ab-selo-in", { scale: 2.2, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.in" }, 3.6);
      fala(3.6, 4.9);
      K.mouth(tl, "ab-nota", "sad", 4.95);
      window.__timelines["abertura"] = tl;
    })();
  </script>
</template>
