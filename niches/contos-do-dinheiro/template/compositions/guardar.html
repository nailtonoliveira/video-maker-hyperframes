<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #gu-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 5,55–20,6 s · Jan/2010: seu Joaquim dobra a nota, guarda na lata, escreve o envelope e põe na prateleira alta. -->
  <div id="root" data-composition-id="guardar" data-width="1080" data-height="1920">
    <svg id="gu-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="gu-cam"><g id="gu-mundo"></g></g>
      <g id="gu-close"></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 5.55;
      const t = (abs) => abs - T0;
      // Close da nota ("Eu sou uma nota de cem") por cima da cozinha
      document.getElementById("gu-close").innerHTML = `
        <rect id="gu-close-bg" x="0" y="0" width="1080" height="1920" fill="#d4ebf7"/>
        <g transform="translate(540,760)">${K.note("gu-eu")}</g>`;
      // Cozinha em 2010
      document.getElementById("gu-mundo").innerHTML = `${K.kitchen("gu", { piso: 1240, prat: 560 })}
        <g transform="translate(300,700)">${K.calendar("gu-cal", [["JAN", "2010"]])}</g>
        <g transform="translate(540,1010)">${K.table("gu-mesa", 640)}</g>
        <g transform="translate(860,1240)">${K.person("gu-vo", K.ELENCO.joaquim)}</g>
        <g transform="translate(200,1240)">${K.person("gu-lia", K.ELENCO.liaCrianca)}</g>
        <g id="gu-lata-pos" transform="translate(660,1010)"><g id="gu-lata-mov">${K.tin("gu-lata")}</g></g>
        <g id="gu-nota-pos" transform="translate(420,950)"><g id="gu-nota-mov"><g id="gu-nota-dobra">${K.note("gu-nota")}</g></g></g>
        <g transform="translate(540,330)">${K.envelope("gu-env", [["Pra Lia,", 64], ["nos 18 anos.", 64]], { w: 620, h: 300 })}</g>`;

      const tl = gsap.timeline({ paused: true });
      gsap.set("#gu-nota-body", { scale: 0.5, transformOrigin: "50% 50%" });
      tl.set("#gu-nota-body", { scale: 0.5, transformOrigin: "50% 50%" }, 0);
      gsap.set(["#gu-lia", "#gu-env"], { opacity: 0 });
      tl.set(["#gu-lia", "#gu-env"], { opacity: 0 }, 0);
      gsap.set("#gu-lata-lid", { y: 0, opacity: 1 });
      tl.set("#gu-lata-lid", { y: 0, opacity: 1 }, 0);
      gsap.set("#gu-eu-body", { scale: 1.6, transformOrigin: "50% 50%" });
      tl.set("#gu-eu-body", { scale: 1.6, transformOrigin: "50% 50%" }, 0);

      // "Eu sou uma nota de cem" (close), a nota pula de alegria
      tl.fromTo("#gu-eu", { y: 30 }, { y: 0, duration: 0.35, ease: "back.out(2.5)" }, t(5.7));
      tl.fromTo("#gu-eu-body", { rotation: -4 }, { rotation: 4, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, t(6.0));
      for (let s = t(5.7); s < t(6.9); s += 0.34) { K.mouth(tl, "gu-eu", "open", s); K.mouth(tl, "gu-eu", "smile", s + 0.17); }
      // "Em janeiro de 2010": sai o close, entra a cozinha
      tl.to(["#gu-close-bg", "#gu-eu"], { opacity: 0, duration: 0.25, ease: "power2.in" }, t(7.4));
      tl.fromTo("#gu-cam", { scale: 1.15, svgOrigin: "540 900" }, { scale: 1, duration: 1.0, ease: "power2.out" }, t(7.4));
      K.pop(tl, "#gu-cal", t(7.9), { dur: 0.35 });
      K.idle(tl, "gu-vo", t(7.6), t(9.5));
      // "me dobrou em quatro": duas dobras, o vô mexe os braços
      tl.fromTo("#gu-vo-armR", { rotation: 0, transformOrigin: "50% 0%" }, { rotation: 40, duration: 0.25, ease: "power2.out" }, t(9.5));
      tl.fromTo("#gu-nota-dobra", { scaleX: 1, transformOrigin: "50% 50%" }, { scaleX: 0.5, duration: 0.22, ease: "power2.inOut" }, t(9.72));
      tl.fromTo("#gu-nota-dobra", { scaleY: 1 }, { scaleY: 0.5, duration: 0.22, ease: "power2.inOut", immediateRender: false }, t(10.14));
      K.mouth(tl, "gu-nota", "open", t(9.75));
      // "e me guardou numa lata de biscoito": abre a tampa, a nota entra, fecha
      tl.to("#gu-lata-lid", { y: -140, opacity: 0, duration: 0.3, ease: "power2.out" }, t(10.4));
      tl.to("#gu-nota-mov", { x: 240, y: -160, duration: 0.35, ease: "power2.out" }, t(10.86));
      tl.to("#gu-nota-mov", { y: -40, duration: 0.25, ease: "power2.in" }, t(11.21));
      tl.set("#gu-nota-mov", { opacity: 0 }, t(11.46));
      tl.to("#gu-lata-lid", { y: 0, opacity: 1, duration: 0.25, ease: "power3.in" }, t(11.5));
      tl.to("#gu-vo-armR", { rotation: 0, duration: 0.3, ease: "power2.inOut" }, t(11.5));
      // "No envelope, ele escreveu: Pra Lia, nos dezoito anos."
      tl.set("#gu-env", { opacity: 1 }, t(12.6));
      K.pop(tl, "#gu-env-in", t(12.6), { dur: 0.35 });
      tl.fromTo("#gu-env-in text:nth-of-type(1)", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(14.28));
      tl.fromTo("#gu-env-in text:nth-of-type(2)", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(14.88));
      K.mouth(tl, "gu-vo", "open", t(14.28));
      K.mouth(tl, "gu-vo", "smile", t(15.5));
      // "A Lia tinha dois anos"
      tl.set("#gu-lia", { opacity: 1 }, t(16.36));
      K.pop(tl, "#gu-lia-body", t(16.36), { origin: "50% 100%" });
      tl.fromTo("#gu-lia-armL", { rotation: 0, transformOrigin: "50% 0%" }, { rotation: 150, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, t(16.8));
      K.idle(tl, "gu-lia", t(17.9), t(20.6), 0.3);
      tl.to("#gu-env", { opacity: 0, duration: 0.2 }, t(17.9));
      // "Eu era o dinheiro mais bem guardado da casa": a lata sobe para a prateleira alta
      tl.fromTo("#gu-vo-armL", { rotation: 0, transformOrigin: "50% 0%" }, { rotation: 160, duration: 0.3, ease: "power2.out" }, t(18.26));
      tl.to("#gu-lata-mov", { x: 130, y: -450, duration: 0.8, ease: "power2.inOut" }, t(18.4));
      tl.to("#gu-vo-armL", { rotation: 0, duration: 0.3 }, t(19.4));
      tl.to("#gu-cam", { scale: 1.3, svgOrigin: "790 560", duration: 1.3, ease: "power2.inOut" }, t(19.2));
      window.__timelines["guardar"] = tl;
    })();
  </script>
</template>
