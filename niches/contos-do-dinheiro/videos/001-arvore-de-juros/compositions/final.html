<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #fi-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 102,25–112,4 s · A filha da Ana planta a primeira moeda; volta para a rua, mesmo quadro do gancho (loop). -->
  <div id="root" data-composition-id="final" data-width="1080" data-height="1920">
    <svg id="fi-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="fi-perto"></g>
      <g id="fi-rua-cam"><g id="fi-rua"></g></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 102.25;
      const t = (abs) => abs - T0;
      document.getElementById("fi-perto").innerHTML = `${K.sky("fi-sky", "skyDay")}
        ${K.cloud("fi-n1", 820, 300, 0.8)}
        ${K.hills("fi-hills", 1000)}${K.ground("fi-chao", 1150)}
        <g transform="translate(-60,1150)">${K.house("fi-casa", { w: 360, h: 380, wall: "#f4d58d", roof: "#c8553d" })}</g>
        <g transform="translate(240,1150)">${K.person("fi-ana", K.ELENCO.ana)}</g>
        <g transform="translate(700,1150)">${K.sprout("fi-broto")}</g>
        <g transform="translate(560,1150)">${K.person("fi-filha", K.ELENCO.filha)}</g>
        <g id="fi-moeda" transform="translate(642,1010)">${K.coin("fi-moeda-in", 22)}</g>
        <g transform="translate(700,330)">${K.sign("fi-cal", [["2026", 84, C.red]], { w: 300 })}</g>`;
      document.getElementById("fi-rua").innerHTML = K.street("fi", {
        anaFrutos: 34, brunoFrutos: 22,
        placas: [["ANA PLANTOU", "R$ 14.400", C.ink], ["BRUNO PLANTOU", "R$ 24.000", C.ink]],
      });

      const tl = gsap.timeline({ paused: true });
      tl.set(["#fi-rua", "#fi-moeda", "#fi-broto"], { opacity: 0 }, 0);
      tl.set("#fi-bruno-tree-grow", { scale: 0.86, transformOrigin: "50% 100%" }, 0);
      K.pop(tl, "#fi-cal-in", 0.2);
      K.idle(tl, "fi-ana", 0.1, 4.5, 0.3);
      // A primeira moeda (104,9)
      tl.fromTo("#fi-filha-armR", { rotation: 0, transformOrigin: "50% 0%" }, { rotation: -60, duration: 0.25, ease: "power2.out" }, t(104.4));
      tl.set("#fi-moeda", { opacity: 1 }, t(104.75));
      tl.fromTo("#fi-moeda-in", { x: 0, y: 0 }, { x: 50, y: 135, duration: 0.3, ease: "power2.in", immediateRender: false }, t(104.75));
      tl.set("#fi-moeda", { opacity: 0 }, t(105.06));
      tl.to("#fi-filha-armR", { rotation: 0, duration: 0.3 }, t(105.0));
      tl.set("#fi-broto", { opacity: 1 }, t(105.1));
      tl.fromTo("#fi-broto-grow", { scale: 0, transformOrigin: "50% 100%" }, { scale: 1.3, duration: 0.45, ease: "back.out(2.4)", immediateRender: false }, t(105.1));
      K.mouth(tl, "fi-filha", "open", t(105.2));
      tl.fromTo("#fi-ana-head", { rotation: 0, transformOrigin: "50% 100%" }, { rotation: 10, duration: 0.3 }, t(105.3));
      // De volta à rua: o mesmo quadro do começo, a câmera assenta até a escala do quadro 0
      tl.set("#fi-perto", { opacity: 0 }, t(106.15));
      tl.set("#fi-rua", { opacity: 1 }, t(106.15));
      tl.fromTo("#fi-rua-cam", { scale: 1.35, svgOrigin: "540 1100" }, { scale: 1, duration: 5.6, ease: "power2.inOut", immediateRender: false }, t(106.15));
      tl.fromTo("#fi-ana-tree-grow", { scaleX: 1, scaleY: 1, transformOrigin: "50% 100%" }, { scaleX: 0.97, scaleY: 1.07, duration: 0.16, yoyo: true, repeat: 1, immediateRender: false }, t(110.6));

      window.__timelines["final"] = tl;
    })();
  </script>
</template>
