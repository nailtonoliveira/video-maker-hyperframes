<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #so-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 66–71,45 s · "Ninguém mexia nela. Ela só crescia." Passagem de tempo 2016→2025 no quintal da Ana. -->
  <div id="root" data-composition-id="sozinha" data-width="1080" data-height="1920">
    <svg id="so-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="so-mundo"></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 66;
      const t = (abs) => abs - T0;
      document.getElementById("so-mundo").innerHTML = `
        <g id="so-dia">${K.sky("so-sky-d", "skyDay")}</g>
        <g id="so-tarde">${K.sky("so-sky-t", "skyDusk")}</g>
        <g id="so-noite">${K.sky("so-sky-n", "skyNight")}</g>
        <g id="so-astro" transform="translate(540,1100)"><g id="so-astro-arm"><circle cx="0" cy="-820" r="70" fill="#ffd166" stroke="${C.ink}" stroke-width="5"/></g></g>
        ${K.hills("so-hills", 1000)}
        ${K.ground("so-chao", 1150)}
        <g transform="translate(-60,1150)">${K.house("so-casa", { w: 360, h: 380, wall: "#f4d58d", roof: "#c8553d" })}</g>
        <g transform="translate(600,1150)">${K.tree("so-tree", 34)}</g>
        <g transform="translate(210,1150)">${K.person("so-ana", K.ELENCO.ana)}</g>
        <g transform="translate(330,1150)">${K.person("so-filha", K.ELENCO.filha)}</g>
        <g transform="translate(540,250)">${K.sign("so-ano", [["2016", 84, C.ink, "so-ano-txt"]], { w: 300 })}</g>`;

      const tl = gsap.timeline({ paused: true });
      // Três dias em 5 s: o céu passa dia → tarde → noite, o sol gira, o ano corre.
      tl.set(["#so-tarde", "#so-noite"], { opacity: 0 }, 0);
      for (let d = 0; d < 3; d++) {
        const s = 0.2 + d * 1.6;
        tl.fromTo("#so-tarde", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, s + 0.5);
        tl.fromTo("#so-noite", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, s + 0.9);
        tl.to(["#so-tarde", "#so-noite"], { opacity: 0, duration: 0.3 }, s + 1.3);
      }
      tl.fromTo("#so-astro-arm", { rotation: -70, svgOrigin: "0 0" }, { rotation: 70 + 360 * 2, duration: 5.2, ease: "none" }, 0.1);
      K.counter(tl, "#so-ano-txt", 2016, 2025, 0.2, 4.6, (v) => String(Math.round(v)));
      // A árvore cresce sozinha e os frutos se acumulam
      tl.fromTo("#so-tree-grow", { scale: 0.62, transformOrigin: "50% 100%" }, { scale: 1, duration: 4.8, ease: "power1.inOut" }, 0.2);
      for (let i = 6; i < 34; i++) tl.fromTo(`#so-tree-f${i}`, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.2, ease: "back.out(3)" }, 0.6 + (i - 6) * 0.15);
      // A filha cresce (de bebê a criança) — a Ana só olha
      tl.fromTo("#so-filha-body", { scale: 0.32, transformOrigin: "50% 100%" }, { scale: 0.7, duration: 4.6, ease: "power1.inOut" }, 0.2);
      tl.fromTo("#so-ana-head", { rotation: 0, transformOrigin: "50% 100%" }, { rotation: 8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.4);
      tl.fromTo("#so-ano-in", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1 }, t(70.4));

      window.__timelines["sozinha"] = tl;
    })();
  </script>
</template>
