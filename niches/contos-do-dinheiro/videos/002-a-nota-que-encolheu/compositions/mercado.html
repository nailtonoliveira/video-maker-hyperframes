<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #me-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 54–65,05 s · No caixa do mercado: as mesmas compras de R$ 100 em 2010 dão R$ 245; a nota encolhe para R$ 41. -->
  <div id="root" data-composition-id="mercado" data-width="1080" data-height="1920">
    <svg id="me-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="me-cam"><g id="me-mundo"></g></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 54;
      const t = (abs) => abs - T0;
      const prods = [["ARROZ", "#f4f1e8"], ["FEIJÃO", "#9c6644"], ["LEITE", "#e9f5fb", { garrafa: true }], ["CAFÉ", "#6f4e37"], ["ÓLEO", "#f6bd60", { garrafa: true }]];
      document.getElementById("me-mundo").innerHTML = `
        <rect x="0" y="0" width="1080" height="1920" fill="#e8f1f2"/>
        ${[0, 1, 2].map((r) => `<rect x="-20" y="${250 + r * 150}" width="520" height="18" fill="${C.trunk}" stroke="${C.ink}" stroke-width="4"/>`).join("")}
        ${[0, 1, 2].map((r) => [0, 1, 2, 3].map((c) => `<rect x="${20 + c * 118}" y="${250 + r * 150 - 96}" width="86" height="96" rx="8" fill="${["#f28482", "#84a59d", "#f6bd60", "#90e0ef"][(r + c) % 4]}" stroke="${C.ink}" stroke-width="4"/>`).join("")).join("")}
        <g transform="translate(110,1240)">${K.person("me-lia", K.ELENCO.lia)}</g>
        ${K.checkout("me-cx")}
        ${prods.map(([n, cor, o], i) => `<g transform="translate(${-200 - i * 190},1110) scale(0.85)"><g id="me-p${i}">${K.product("me-pr" + i, n, cor, Object.assign({ w: 170 }, o))}</g></g>`).join("")}
        <g transform="translate(300,560)">${K.sign("me-2010", [["EM 2010", 40], ["R$ 100", 84]], { w: 360, nails: false })}</g>
        <rect id="me-fant" x="${420 - 220 * 0.9}" y="${840 - 110 * 0.9}" width="${440 * 0.9}" height="${220 * 0.9}" rx="16" fill="none" stroke="${C.ink}" stroke-width="5" stroke-dasharray="16 12" opacity="0"/>
        <g transform="translate(420,840)">${K.note("me-nota")}</g>
        <g transform="translate(300,600)">${K.sign("me-vale", [["POR DENTRO: R$ 41", 46, "#fff"]], { w: 500, bg: C.red, nails: false })}</g>`;

      const tl = gsap.timeline({ paused: true });
      gsap.set("#me-nota-body", { scale: 0.9, transformOrigin: "50% 50%" });
      tl.set("#me-nota-body", { scale: 0.9, transformOrigin: "50% 50%" }, 0);
      gsap.set(["#me-nota", "#me-2010", "#me-vale"], { opacity: 0 });
      tl.set(["#me-nota", "#me-2010", "#me-vale"], { opacity: 0 }, 0);
      tl.fromTo("#me-cam", { x: 160 }, { x: 0, duration: 0.8, ease: "power2.out" }, 0);
      K.idle(tl, "me-lia", 0.2, t(62.4));
      // "Foi lá que eu entendi." → as compras passam pela esteira, uma a uma
      prods.forEach((_, i) => {
        tl.fromTo(`#me-p${i}`, { x: 0 }, { x: (630 + 340 * i) / 0.85, duration: 1.0, ease: "power2.out" }, t(54.2) + i * 0.3);
      });
      // "As mesmas coisas que eu pagava em 2010…"
      tl.set("#me-2010", { opacity: 1 }, t(55.86));
      K.pop(tl, "#me-2010-in", t(55.86));
      // "…agora custavam duzentos e quarenta e cinco reais." → o visor corre até R$ 245
      K.counter(tl, "#me-cx-preco", 0, 245.34, t(58.2), 0.86);
      tl.fromTo("#me-cx-visor", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(59.06));
      K.mouth(tl, "me-lia", "open", t(59.2));
      // "Eu continuava escrito cem." → a nota em cima do balcão, inteira
      tl.set("#me-nota", { opacity: 1 }, t(60.42));
      tl.fromTo("#me-nota", { y: -80 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, t(60.42));
      tl.to("#me-2010", { opacity: 0, duration: 0.2 }, t(60.3));
      for (let s = t(60.5); s < t(62.0); s += 0.34) { K.mouth(tl, "me-nota", "open", s); K.mouth(tl, "me-nota", "flat", s + 0.17); }
      // "Mas, por dentro, eu valia quarenta e um." → encolhe para 0,41 dentro do contorno do tamanho antigo
      tl.set("#me-fant", { opacity: 0.8 }, t(62.62));
      tl.to("#me-nota-body", { scale: 0.9 * 0.4076, duration: 0.9, ease: "power3.inOut" }, t(62.9));
      tl.set("#me-vale", { opacity: 1 }, t(63.6));
      K.pop(tl, "#me-vale-in", t(63.6));
      K.mouth(tl, "me-nota", "sad", t(63.8));
      K.mouth(tl, "me-lia", "sad", t(63.8));
      window.__timelines["mercado"] = tl;
    })();
  </script>
</template>
