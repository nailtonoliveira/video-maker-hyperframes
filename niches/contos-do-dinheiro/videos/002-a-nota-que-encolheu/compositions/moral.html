<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #mo-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 65,05–73,15 s · Ninguém roubou nem gastou: 192 meses de IPCA comem a nota; seis retratos dela de 2010 a 2025 (valores reais). -->
  <div id="root" data-composition-id="moral" data-width="1080" data-height="1920">
    <svg id="mo-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="mo-cam"><g id="mo-mundo"></g></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 65.05;
      const t = (abs) => abs - T0;
      // Poder de compra da nota (R$ de jan/2010) em cada marco: dados/calculo.py
      const MARCOS = [["JAN 2010", 100], ["2013", 79.09], ["2016", 63.19], ["2019", 56.72], ["2022", 46.61], ["2025", 40.76]];
      const POS = [[190, 560], [540, 560], [890, 560], [190, 960], [540, 960], [890, 960]];
      const BASE = 0.66;
      const retratos = MARCOS.map(([ano, v], i) => {
        const [x, y] = POS[i], s = BASE * v / 100;
        return `<g id="mo-r${i}"><g id="mo-r${i}-in" transform="translate(${x},${y})">
          <text x="0" y="${-110 * s - 34}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="44" fill="${C.ink}">${ano}</text>
          <g transform="scale(${s})">${K.note("mo-n" + i, { boca: i < 2 ? "smile" : i < 4 ? "flat" : "sad" })}</g>
          <text x="0" y="${110 * s + 64}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="54" fill="${i === 5 ? C.red : C.ink}">${K.brl(v)}</text>
        </g></g>`;
      }).join("");
      document.getElementById("mo-mundo").innerHTML = `
        <rect x="0" y="0" width="1080" height="1920" fill="#d4ebf7"/>
        <rect x="0" y="1180" width="1080" height="760" fill="#b9dcef"/>
        <g transform="translate(540,300)">${K.sign("mo-c1", [["LATA FECHADA ✓", 48, "#2a7d4f"]], { w: 520, nails: false })}</g>
        <g transform="translate(540,410)">${K.sign("mo-c2", [["NENHUM GASTO ✓", 48, "#2a7d4f"]], { w: 520, nails: false })}</g>
        <g transform="translate(540,760)">${K.note("mo-big")}</g>
        <g transform="translate(540,1040)">${K.sign("mo-mes", [["MÊS 1 DE 192", 52, C.ink, "mo-mes-t"]], { w: 520, nails: false })}</g>
        ${retratos}`;

      const tl = gsap.timeline({ paused: true });
      gsap.set("#mo-big-body", { scale: 1.1, transformOrigin: "50% 50%" });
      tl.set("#mo-big-body", { scale: 1.1, transformOrigin: "50% 50%" }, 0);
      gsap.set(["#mo-c1", "#mo-c2", "#mo-mes", ...MARCOS.map((_, i) => `#mo-r${i}`)], { opacity: 0 });
      tl.set(["#mo-c1", "#mo-c2", "#mo-mes", ...MARCOS.map((_, i) => `#mo-r${i}`)], { opacity: 0 }, 0);
      tl.fromTo("#mo-big", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0);
      // "Ninguém me roubou. Ninguém me gastou."
      tl.set("#mo-c1", { opacity: 1 }, t(65.7));
      K.pop(tl, "#mo-c1-in", t(65.7));
      tl.set("#mo-c2", { opacity: 1 }, t(66.9));
      K.pop(tl, "#mo-c2-in", t(66.9));
      // "Os preços me comeram, um pedacinho por mês." → 192 meses, a nota encolhe até 0,41
      tl.set("#mo-mes", { opacity: 1 }, t(67.85));
      K.pop(tl, "#mo-mes-in", t(67.85), { dur: 0.3 });
      K.counter(tl, "#mo-mes-t", 1, 192, t(68.0), 2.1, (v) => `MÊS ${Math.round(v)} DE 192`);
      tl.to("#mo-big-body", { scale: 1.1 * 0.4076, duration: 2.1, ease: "none" }, t(68.0));
      K.mouth(tl, "mo-big", "sad", t(68.4));
      // "Dinheiro parado não fica parado." → seis retratos da mesma nota, de 2010 a 2025
      tl.to(["#mo-big", "#mo-mes", "#mo-c1", "#mo-c2"], { opacity: 0, duration: 0.2 }, t(70.25));
      MARCOS.forEach((_, i) => {
        tl.set(`#mo-r${i}`, { opacity: 1 }, t(70.4) + i * 0.22);
        tl.fromTo(`#mo-r${i}`, { scale: 0.4, svgOrigin: `${POS[i][0]} ${POS[i][1]}` }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, t(70.4) + i * 0.22);
      });
      // "Ele encolhe."
      tl.fromTo("#mo-r5-in", { scale: 1 }, { scale: 1.18, svgOrigin: "890 960", duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(72.4));
      window.__timelines["moral"] = tl;
    })();
  </script>
</template>
