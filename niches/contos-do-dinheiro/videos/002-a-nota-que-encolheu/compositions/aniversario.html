<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #an-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 43,75–54 s · Dez/2025: a Lia faz 18 anos, o vô desce a lata, entrega a nota; a Lia sorri e sai para o mercado. -->
  <div id="root" data-composition-id="aniversario" data-width="1080" data-height="1920">
    <svg id="an-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="an-cam"><g id="an-mundo"></g></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 43.75;
      const t = (abs) => abs - T0;
      document.getElementById("an-mundo").innerHTML = `${K.kitchen("an", { piso: 1240, prat: 560, janelaX: 640, ceu: "#f8c58f" })}
        <g transform="translate(260,420)">${K.calendar("an-cal", [["DEZ", "2025"]])}</g>
        <g transform="translate(540,1010)">${K.table("an-mesa", 640)}</g>
        <g transform="translate(400,1010)">${K.cake("an-bolo", "18")}</g>
        <g transform="translate(860,1240)">${K.person("an-vo", K.ELENCO.joaquim)}</g>
        <g id="an-lia-pos" transform="translate(190,1240)"><g id="an-lia-mov">${K.person("an-lia", K.ELENCO.lia)}</g></g>
        <g id="an-lata-pos" transform="translate(790,560)"><g id="an-lata-mov">${K.tin("an-lata")}</g></g>
        <g id="an-nota-pos" transform="translate(680,900)"><g id="an-nota-mov">${K.note("an-nota")}</g></g>`;

      const tl = gsap.timeline({ paused: true });
      gsap.set("#an-lata-lid", { y: 0, opacity: 1 });
      tl.set("#an-lata-lid", { y: 0, opacity: 1 }, 0);
      gsap.set("#an-nota-body", { scale: 0.15, transformOrigin: "50% 50%" });
      tl.set("#an-nota-body", { scale: 0.15, transformOrigin: "50% 50%" }, 0);
      gsap.set(["#an-nota", "#an-bolo"], { opacity: 0 });
      tl.set(["#an-nota", "#an-bolo"], { opacity: 0 }, 0);
      tl.fromTo("#an-cam", { scale: 1.12, svgOrigin: "540 900" }, { scale: 1, duration: 1.1, ease: "power2.out" }, 0);
      K.pop(tl, "#an-cal", t(44.1), { dur: 0.35 });
      K.idle(tl, "an-vo", 0.3, t(47.0));
      K.idle(tl, "an-lia", 0.2, t(51.4), 0.4);
      // "a Lia fez dezoito anos"
      tl.set("#an-bolo", { opacity: 1 }, t(45.9));
      K.pop(tl, "#an-bolo-in", t(45.9), { origin: "50% 100%" });
      K.mouth(tl, "an-lia", "open", t(46.3));
      K.mouth(tl, "an-lia", "smile", t(47.0));
      // "O vô abriu a lata": desce da prateleira para a mesa e abre
      tl.fromTo("#an-vo-armL", { rotation: 0, transformOrigin: "50% 0%" }, { rotation: 160, duration: 0.25, ease: "power2.out" }, t(47.2));
      tl.to("#an-lata-mov", { x: -110, y: 450, duration: 0.55, ease: "power2.inOut" }, t(47.35));
      tl.to("#an-vo-armL", { rotation: 30, duration: 0.3 }, t(47.9));
      tl.to("#an-lata-lid", { y: -140, opacity: 0, duration: 0.25, ease: "power2.out" }, t(48.0));
      // "Cem reais, minha neta. Guardei pra você." A nota sai da lata e se desdobra
      tl.set("#an-nota", { opacity: 1 }, t(48.6));
      tl.to("#an-nota-body", { scale: 0.62, duration: 0.45, ease: "back.out(1.8)" }, t(48.6));
      tl.fromTo("#an-nota-mov", { y: 60 }, { y: -170, duration: 0.45, ease: "power2.out" }, t(48.6));
      for (let s = t(48.96); s < t(50.9); s += 0.32) { K.mouth(tl, "an-vo", "open", s); K.mouth(tl, "an-vo", "smile", s + 0.16); }
      K.mouth(tl, "an-nota", "open", t(49.2));
      // "A Lia sorriu. E me levou ao mercado."
      K.mouth(tl, "an-lia", "open", t(51.58));
      tl.fromTo(["#an-lia-armL", "#an-lia-armR"], { rotation: 0, transformOrigin: "50% 0%" }, { rotation: (i) => (i ? -150 : 150), duration: 0.3, ease: "back.out(2)" }, t(51.6));
      K.mouth(tl, "an-nota", "smile", t(51.9));
      tl.to("#an-nota-mov", { x: -400, y: -120, duration: 0.45, ease: "power2.inOut" }, t(52.3));
      tl.to(["#an-lia-armL", "#an-lia-armR"], { rotation: 0, duration: 0.25 }, t(52.5));
      tl.to(["#an-lia-mov", "#an-nota-mov"], { x: "-=520", duration: 0.7, ease: "power2.in" }, t(52.9));
      window.__timelines["aniversario"] = tl;
    })();
  </script>
</template>
