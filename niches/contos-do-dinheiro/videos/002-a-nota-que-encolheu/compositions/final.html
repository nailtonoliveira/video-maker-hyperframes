<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #fi-svg { position: absolute; left: 0; top: 0; }
  </style>
  <!-- 73,15–79,94 s · 2026: a Lia ganha outra nota e procura uma lata; a nota velha tenta avisar. Corta para o quadro do gancho (loop). -->
  <div id="root" data-composition-id="final" data-width="1080" data-height="1920">
    <svg id="fi-svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overflow>
      <g id="fi-cam"><g id="fi-mundo"></g></g>
      <g id="fi-hook"></g>
    </svg>
  </div>
  <script>
    (function () {
      const K = window.KIT, C = K.C, T0 = 73.15;
      const t = (abs) => abs - T0;
      document.getElementById("fi-mundo").innerHTML = `${K.kitchen("fi", { piso: 1240, prat: 560 })}
        <g transform="translate(300,700)">${K.calendar("fi-cal", [["JAN", "2026"]])}</g>
        <g transform="translate(540,1010)">${K.table("fi-mesa", 640)}</g>
        <g transform="translate(660,1010)">${K.tin("fi-lata")}</g>
        <g transform="translate(240,1240)">${K.person("fi-lia", K.ELENCO.lia)}</g>
        <g transform="translate(400,860)">${K.note("fi-nova")}</g>
        <g transform="translate(900,975)">${K.note("fi-velha", { boca: "flat" })}</g>
        <g transform="translate(820,800)">${K.bubble("fi-fala", [["!!!", 72]], { w: 240, h: 130, tx: 70, ty: 150 })}</g>`;
      // Quadro do gancho (idêntico ao quadro 0 de abertura.html): o vídeo emenda em loop.
      document.getElementById("fi-hook").innerHTML = `
        <rect x="0" y="0" width="1080" height="1920" fill="#fbe8c8"/>
        <rect x="0" y="1060" width="1080" height="140" fill="#f1d3a1"/>
        <rect x="-20" y="1180" width="1120" height="780" fill="#c08552" stroke="${C.ink}" stroke-width="5"/>
        <rect x="-20" y="1180" width="1120" height="30" fill="#a86f42"/>
        <g transform="translate(540,1180) scale(1.5)">${K.tin("fh-lata")}</g>
        <g transform="translate(540,820)"><g>${K.note("fh-nota")}</g></g>
        <g transform="translate(540,330)">${K.sign("fh-placa", [["R$ 100", 104, C.ink]], { w: 560 })}</g>`;

      const tl = gsap.timeline({ paused: true });
      gsap.set("#fh-nota-body", { scale: 1.5, transformOrigin: "50% 50%" });
      tl.set("#fh-nota-body", { scale: 1.5, transformOrigin: "50% 50%" }, 0);
      gsap.set("#fh-lata-lid", { y: -140, opacity: 0 });
      tl.set("#fh-lata-lid", { y: -140, opacity: 0 }, 0);
      gsap.set("#fi-hook", { opacity: 0 });
      tl.set("#fi-hook", { opacity: 0 }, 0);
      gsap.set("#fi-lata-lid", { y: -140, opacity: 0 });
      tl.set("#fi-lata-lid", { y: -140, opacity: 0 }, 0);
      gsap.set("#fi-nova-body", { scale: 0.5, transformOrigin: "50% 50%" });
      tl.set("#fi-nova-body", { scale: 0.5, transformOrigin: "50% 50%" }, 0);
      gsap.set("#fi-velha-body", { scale: 0.5 * 0.4076, transformOrigin: "50% 50%" });
      tl.set("#fi-velha-body", { scale: 0.5 * 0.4076, transformOrigin: "50% 50%" }, 0);
      gsap.set(["#fi-nova", "#fi-lata", "#fi-fala"], { opacity: 0 });
      tl.set(["#fi-nova", "#fi-lata", "#fi-fala"], { opacity: 0 }, 0);
      tl.fromTo("#fi-cam", { scale: 1.1, svgOrigin: "540 900" }, { scale: 1, duration: 0.9, ease: "power2.out" }, 0);
      K.pop(tl, "#fi-cal", t(73.4), { dur: 0.35 });
      K.idle(tl, "fi-lia", 0.2, t(75.8));
      // "a Lia ganhou outra nota de cem"
      tl.set("#fi-nova", { opacity: 1 }, t(74.2));
      K.pop(tl, "#fi-nova-body", t(74.2));
      tl.set("#fi-nova-body", { scale: 0.5 }, t(74.63));
      K.mouth(tl, "fi-lia", "open", t(74.4));
      K.mouth(tl, "fi-lia", "smile", t(75.2));
      // "E já estava procurando uma lata." → olha para um lado e para o outro; acha a lata
      tl.fromTo("#fi-lia-head", { rotation: 0, transformOrigin: "50% 100%" }, { rotation: -14, duration: 0.25, ease: "sine.inOut" }, t(76.0));
      tl.to("#fi-lia-head", { rotation: 14, duration: 0.35, ease: "sine.inOut" }, t(76.35));
      tl.to("#fi-lia-head", { rotation: 0, duration: 0.25 }, t(76.9));
      tl.set("#fi-lata", { opacity: 1 }, t(77.0));
      tl.fromTo("#fi-lata", { y: -60 }, { y: 0, duration: 0.3, ease: "bounce.out" }, t(77.0));
      // "Eu queria avisar…" → a nota velha pula e grita sem som
      tl.set("#fi-fala", { opacity: 1 }, t(78.0));
      K.pop(tl, "#fi-fala-in", t(78.0), { dur: 0.3 });
      K.mouth(tl, "fi-velha", "open", t(78.0));
      tl.fromTo("#fi-velha-body", { y: 0 }, { y: -18, duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, t(78.05));
      // "…Mas nota não fala." → o balão some; corte para o quadro do gancho
      tl.to("#fi-fala", { opacity: 0, duration: 0.15 }, t(79.05));
      K.mouth(tl, "fi-velha", "sad", t(79.1));
      tl.set("#fi-hook", { opacity: 1 }, t(79.5));
      window.__timelines["final"] = tl;
    })();
  </script>
</template>
