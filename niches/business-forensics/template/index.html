<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Chão","default":"#120a0b"},
    {"id":"ink","type":"color","label":"Papel","default":"#f2e8d5"},
    {"id":"mint","type":"color","label":"Ouro","default":"#e9b949"},
    {"id":"alert","type":"color","label":"Fraude","default":"#ff5a3c"},
    {"id":"cyan","type":"color","label":"Violeta UV","default":"#9b8cff"},
    {"id":"gray","type":"color","label":"Taupe","default":"#a3958a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #120a0b;
        --ink: #f2e8d5;
        --mint: #e9b949;
        --alert: #ff5a3c;
        --cyan: #9b8cff;
        --gray: #a3958a;
        --font-display: "Barlow Condensed", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-mono);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- Duração = locução. Depois de transcrever: tools/set_duration.py <pasta do vídeo> -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52"
      data-width="1080"
      data-height="1920"
    >
      <!-- Mundo 3D (motor + kit + assets/episode/scene.js) -->
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="52"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- HUD 2D (ficha do caso, medidor em degraus, selo de data e carimbo) -->
      <div
        id="hud"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="52"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <!-- Legendas: geradas por tools/build_captions.py (estilo label-tag) -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="52"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <!-- Locução -->
      <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="10" data-volume="1.18"></audio>

      <!-- Trilha procedural: tools/.venv/bin/python shared/trilha/trilha.py <vídeo> gera estes wavs de assets/episode/trilha.json -->
      <audio id="ambiente" class="clip" src="assets/audio/ambiente.wav" data-start="0" data-duration="52" data-track-index="20" data-volume="0.32"></audio>
      <audio id="music" class="clip" src="assets/audio/musica.wav" data-start="0" data-duration="52" data-track-index="21" data-volume="0.45"></audio>
      <audio id="efeitos" class="clip" src="assets/audio/efeitos.wav" data-start="0" data-duration="52" data-track-index="22" data-volume="0.7"></audio>

      <!-- SFX (assets/sfx/): pico 1 quadro após a imagem; zero SFX em t = 0 e nos últimos 100 ms -->
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.18" data-duration="0.28" data-track-index="30" data-volume="0.25"></audio>
      <audio id="sfx-rise1" class="clip" src="assets/sfx/pop.mp3" data-start="4.12" data-duration="0.22" data-track-index="31" data-volume="0.35"></audio>
      <audio id="sfx-ping1" class="clip" src="assets/sfx/ping.mp3" data-start="9.82" data-duration="0.6" data-track-index="32" data-volume="0.45"></audio>
      <audio id="sfx-lid" class="clip" src="assets/sfx/key-press.mp3" data-start="16.4" data-duration="0.2" data-track-index="33" data-volume="0.4"></audio>
      <audio id="sfx-uv" class="clip" src="assets/sfx/ping.mp3" data-start="24.6" data-duration="0.6" data-track-index="34" data-volume="0.4"></audio>
      <audio id="sfx-err" class="clip" src="assets/sfx/error.mp3" data-start="29.0" data-duration="0.5" data-track-index="35" data-volume="0.9"></audio>
      <audio id="sfx-slam" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="33.35" data-duration="1.2" data-track-index="36" data-volume="0.6"></audio>
      <audio id="sfx-zero" class="clip" src="assets/sfx/glitch-2.mp3" data-start="38.15" data-duration="0.45" data-track-index="37" data-volume="0.4"></audio>
      <audio id="sfx-rewind" class="clip" src="assets/sfx/riser.mp3" data-start="49.6" data-duration="2.3" data-track-index="38" data-volume="0.22"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
