<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Chão","default":"#120a0b"},
    {"id":"ink","type":"color","label":"Papel","default":"#f2e8d5"},
    {"id":"mint","type":"color","label":"Ouro","default":"#e9b949"},
    {"id":"alert","type":"color","label":"Fraude","default":"#ff5a3c"},
    {"id":"cyan","type":"color","label":"Violeta UV","default":"#9b8cff"},
    {"id":"gray","type":"color","label":"Taupe","default":"#a3958a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        /* Barlow Condensed não vem empacotada no HyperFrames e o workspace não tem o .woff2: sem ela instalada,
           HUD e legendas (captions.json → var(--font-display)) caem na Oswald, empacotada. */
        --ground: #120a0b;
        --ink: #f2e8d5;
        --mint: #e9b949;
        --alert: #ff5a3c;
        --cyan: #9b8cff;
        --gray: #a3958a;
        --font-display: "Barlow Condensed", "Oswald", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-mono);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- Duração = locução. Depois de transcrever: tools/set_duration.py <pasta do vídeo> -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="55.55"
      data-width="1080"
      data-height="1920"
    >
      <!-- Mundo 3D (motor + kit + assets/episode/scene.js) -->
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="55.55"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- HUD 2D (ficha do caso, medidor em degraus, selo de data e carimbo) -->
      <div
        id="hud"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="55.55"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <!-- Legendas: geradas por tools/build_captions.py (estilo label-tag) -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="55.55"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <!-- Locução -->
      <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="10" data-volume="1.18"></audio>

      <!-- Trilha procedural: tools/.venv/bin/python shared/trilha/trilha.py <vídeo> gera estes wavs de assets/episode/trilha.json -->
      <audio id="ambiente" class="clip" src="assets/audio/ambiente.wav" data-start="0" data-duration="55.55" data-track-index="20" data-volume="0.32"></audio>
      <audio id="music" class="clip" src="assets/audio/musica.wav" data-start="0" data-duration="55.55" data-track-index="21" data-volume="0.45"></audio>
      <audio id="efeitos" class="clip" src="assets/audio/efeitos.wav" data-start="0" data-duration="55.55" data-track-index="22" data-volume="0.7"></audio>

      <!-- SFX (assets/sfx/): pico 1 quadro após a imagem; zero SFX em t = 0 e nos últimos 100 ms -->
      <!-- corte para a rachadura em 2,16 -->
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.07" data-duration="0.45" data-track-index="30" data-volume="0.25"></audio>
      <!-- onda da Manada em 11,58 -->
      <audio id="sfx-herd" class="clip" src="assets/sfx/pop.mp3" data-start="11.5" data-duration="0.5" data-track-index="31" data-volume="0.35"></audio>
      <!-- medidor chega a R$ 20 BI em 13,60 -->
      <audio id="sfx-topo" class="clip" src="assets/sfx/ping.mp3" data-start="13.31" data-duration="0.9" data-track-index="32" data-volume="0.3"></audio>
      <!-- caixas abrem em 17,64 -->
      <audio id="sfx-lid" class="clip" src="assets/sfx/key-press.mp3" data-start="17.6" data-duration="0.3" data-track-index="33" data-volume="0.4"></audio>
      <!-- lanterna UV acende em 25,56 -->
      <audio id="sfx-uv" class="clip" src="assets/sfx/ping.mp3" data-start="25.27" data-duration="1.0" data-track-index="34" data-volume="0.4"></audio>
      <!-- rachadura sobe + alarme em 29,40 -->
      <audio id="sfx-err" class="clip" src="assets/sfx/error.mp3" data-start="28.83" data-duration="1.1" data-track-index="35" data-volume="0.55"></audio>
      <!-- carimbo em 34,64 -->
      <audio id="sfx-slam" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="34.65" data-duration="1.2" data-track-index="36" data-volume="0.6"></audio>
      <!-- medidor zera em 38,68 -->
      <audio id="sfx-zero" class="clip" src="assets/sfx/glitch-2.mp3" data-start="38.69" data-duration="0.6" data-track-index="37" data-volume="0.35"></audio>
      <!-- etiquetas CVM/PF em 45,94 -->
      <audio id="sfx-tag" class="clip" src="assets/sfx/click.mp3" data-start="45.92" data-duration="0.3" data-track-index="38" data-volume="0.4"></audio>
      <!-- carimbo PAGO em 51,14 -->
      <audio id="sfx-pago" class="clip" src="assets/sfx/click.mp3" data-start="51.12" data-duration="0.3" data-track-index="39" data-volume="0.5"></audio>
      <!-- carimbo BATIDA em 52,60 -->
      <audio id="sfx-batida" class="clip" src="assets/sfx/click.mp3" data-start="52.58" data-duration="0.3" data-track-index="40" data-volume="0.5"></audio>
      <!-- corte para a rebobinagem em 53,15 -->
      <audio id="sfx-rewcut" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="53.06" data-duration="0.45" data-track-index="41" data-volume="0.25"></audio>
      <!-- rebobinagem 53,15 → 55,35 (riser cortado 1 s adiante: crescendo até o loop) -->
      <audio id="sfx-rewind" class="clip" src="assets/sfx/riser.mp3" data-start="53.15" data-duration="2.2" data-media-start="1" data-track-index="42" data-volume="0.22"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
