  </style>
  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
    <div id="hud-ficha">
      <svg id="ficha-clipe" viewBox="0 0 28 72" fill="none">
        <path d="M8 18V54C8 60.6 13.4 66 20 66C24.4 66 26 62.4 26 56V14C26 7.4 20.6 2 14 2C7.4 2 2 7.4 2 14V48" stroke="#a3958a" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div id="ficha-furo"></div>
      <div id="ficha-sub">CASO Nº 002 · 123MILHAS</div>
      <div id="ficha-tit">R$ 2,3 BI → ZERO</div>
    </div>

    <div id="hud-valor">
      <div id="valor-rot">DÍVIDA DECLARADA</div>
      <div id="valor-linha">
        <div id="valor-num">R$ 2,3 BI</div>
        <div id="valor-delta">▼</div>
      </div>
      <div id="valor-barra"></div>
    </div>

    <div id="hud-data">
      <div id="data-txt">AGO/2023</div>
    </div>

    <div id="hud-carimbo" data-layout-allow-occlusion>CALOTE</div>
  </div>
  <script>
    (function () {
      const DUR = 59.77;
      const tl = gsap.timeline({ paused: true });
      const OURO = "#e9b949";
      const FRAUDE = "#ff5a3c";

      // R$ 2,3 BI / ZERO e 700 MIL / ZERO (vírgula decimal, sem Intl: o mesmo texto em qualquer máquina)
      const fmtBi = (v) => (v <= 0.001 ? "ZERO" : "R$ " + v.toFixed(1).replace(".", ",") + " BI");
      const fmtMil = (v) => (v < 0.5 ? "ZERO" : Math.round(v) + " MIL");

      // Troca o texto da ficha com wipe determinístico; o cartão nunca sai da tela.
      function ficha(t0, sub, tit) {
        if (t0 <= 0) {
          tl.set("#ficha-sub", { textContent: sub, clipPath: "inset(0 0% 0 0)" }, 0);
          tl.set("#ficha-tit", { textContent: tit, clipPath: "inset(0 0% 0 0)" }, 0);
          return;
        }
        tl.to(["#ficha-sub", "#ficha-tit"], { clipPath: "inset(0 0% 0 100%)", duration: 0.16, ease: "power2.in" }, t0);
        tl.fromTo("#hud-ficha", { scaleY: 1 }, { scaleY: 0.94, duration: 0.06, yoyo: true, repeat: 1 }, t0 + 0.12);
        tl.set("#ficha-sub", { textContent: sub, clipPath: "inset(0 100% 0 0)" }, t0 + 0.165);
        tl.set("#ficha-tit", { textContent: tit, clipPath: "inset(0 100% 0 0)" }, t0 + 0.165);
        tl.to(["#ficha-sub", "#ficha-tit"], { clipPath: "inset(0 0% 0 0)", duration: 0.38, ease: "expo.out" }, t0 + 0.17);
      }

      function cores(t0, cor, delta, deltaCor) {
        tl.set("#hud-valor", { borderColor: cor }, t0);
        tl.set("#valor-num", { color: cor }, t0);
        tl.set("#valor-barra", { backgroundColor: cor }, t0);
        tl.set("#valor-delta", { textContent: delta, color: deltaCor }, t0);
      }

      // Hodômetro em degraus via tl.set (determinístico e seekável).
      function valor(t0, t1, de, ate, { rotulo, delta = "", cor = OURO, deltaCor = FRAUDE, pico = 2.3, passos = 7, fmt = fmtBi } = {}) {
        if (rotulo) tl.set("#valor-rot", { textContent: rotulo }, t0);
        cores(t0, cor, delta, deltaCor);
        for (let i = 0; i <= passos; i++) {
          const u = i / passos;
          const k = ate >= de ? 1 - Math.pow(1 - u, 2) : Math.pow(u, 3);
          const v = de + (ate - de) * k;
          const ti = t0 + (t1 - t0) * u;
          tl.set("#valor-num", { textContent: fmt(v) }, ti);
          tl.set("#valor-barra", { scaleX: Math.max(0.02, Math.min(1, v / pico)) }, ti);
          // set + to (não fromTo): voltando a agulha, o "to" retorna ao valor do set e o set ao estado anterior
          if (i > 0) {
            tl.set("#valor-num", { scale: 1.16 }, ti);
            tl.to("#valor-num", { scale: 1, duration: 0.16, ease: "back.out(2.4)" }, ti);
          }
        }
      }

      // Leitura fixa (texto, não número) com o mesmo "tranco" do hodômetro.
      function marca(t0, rotulo, num, { delta = "", cor = FRAUDE, deltaCor = FRAUDE, barra = 0.02 } = {}) {
        tl.set("#valor-rot", { textContent: rotulo }, t0);
        cores(t0, cor, delta, deltaCor);
        tl.set("#valor-num", { textContent: num }, t0);
        tl.set("#valor-barra", { scaleX: barra }, t0);
        tl.set("#valor-num", { scale: 1.2 }, t0);
        tl.to("#valor-num", { scale: 1, duration: 0.18, ease: "back.out(2.4)" }, t0);
      }

      function data(t0, txt) {
        if (t0 <= 0) {
          tl.set("#data-txt", { textContent: txt, rotationX: 0 }, 0);
          return;
        }
        tl.to("#data-txt", { rotationX: 90, duration: 0.09, ease: "power2.in" }, t0);
        tl.set("#data-txt", { textContent: txt }, t0 + 0.095);
        tl.fromTo("#data-txt", { rotationX: -90 }, { rotationX: 0, duration: 0.14, ease: "back.out(2)" }, t0 + 0.1);
      }

      function carimbo(t0, txt, tRewind) {
        tl.set("#hud-carimbo", { textContent: txt, x: 0, y: 0, rotation: -8, scale: 2.2, opacity: 0 }, 0);
        tl.to("#hud-carimbo", { scale: 1, opacity: 1, duration: 0.14, ease: "power4.in" }, t0 - 0.14);
        tl.to("#hud-carimbo", { scale: 1.04, duration: 0.06, yoyo: true, repeat: 1 }, t0);
        tl.to("#hud-carimbo", { x: 280, y: -520, scale: 0.28, duration: 0.32, ease: "power3.inOut" }, t0 + 1.4);
        tl.to("#hud-carimbo", { opacity: 0, duration: 0.2, ease: "power2.in" }, tRewind);
      }

      // Estado do quadro 0 (= último quadro): medidor no pico com ▼ e selo neutro
      function quadroZero(t0) {
        tl.set("#valor-rot", { textContent: "DÍVIDA DECLARADA" }, t0);
        cores(t0, OURO, "▼", FRAUDE);
        tl.set("#valor-num", { textContent: "R$ 2,3 BI", scale: 1 }, t0);
        tl.set("#valor-barra", { scaleX: 1 }, t0);
        tl.set("#data-txt", { color: "#f2e8d5", opacity: 1 }, t0);
        tl.set("#hud-data", { borderColor: "#a3958a" }, t0);
      }

      // ==================== Cronograma do episódio 002 (59,77 s; âncoras de assets/voice.json) ====================
      // 0,00 s "dois vírgula três bilhões": quadro 0 / thumbnail
      ficha(0, "CASO Nº 002 · 123MILHAS", "R$ 2,3 BI → ZERO");
      quadroZero(0);
      data(0, "AGO/2023");

      // 3,22 s "setecentos mil passageiros"
      valor(3.22, 4.6, 0, 700, { rotulo: "CREDORES", delta: "▲", cor: FRAUDE, pico: 700, passos: 6, fmt: fmtMil });

      // 7,42 s "apenas onze dias": 18/AGO → 29/AGO em degraus secos
      for (let d = 18; d <= 29; d++) tl.set("#data-txt", { textContent: d + "/AGO" }, 7.42 + (d - 18) * 0.12);

      // 9,10 s "Em 2023": a ascensão da linha Promo
      ficha(9.1, "ATO I · A ASCENSÃO", "METADE DO PREÇO");
      ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL"].forEach((m, i) => data(9.1 + i * 1.2, m + "/2023"));
      valor(9.6, 17.8, 0, 2.3, { rotulo: "DÍVIDA A DESCOBERTO", delta: "▲", cor: OURO, deltaCor: OURO, passos: 8 });

      // 18,86 s "bilhetes não existiam"
      ficha(18.86, "ATO II · A MANOBRA", "BILHETES FANTASMA");
      data(18.86, "LINHA PROMO");
      marca(18.86, "RESERVA PRÉVIA", "ZERO", { delta: "▼" });

      // 24,48 s "bancar passageiros antigos"
      valor(24.6, 26.9, 0, 700, { rotulo: "CREDORES", delta: "▲", cor: FRAUDE, pico: 700, passos: 6, fmt: fmtMil });

      // 27,16 s "luz UV da perícia" · 31,08 s "tarifas subiram" · 33,72 s "perdeu o chão"
      ficha(27.16, "ATO III · A PERÍCIA", "PIRÂMIDE SEM LASTRO");
      data(27.16, "LUZ UV");
      data(31.08, "TARIFAS ▲");
      marca(31.08, "TARIFAS AÉREAS", "EM ALTA", { delta: "▲", barra: 1 });
      marca(33.72, "LASTRO", "ZERO", { delta: "▼" });

      // 35,86 s "os voos travaram" · 38,14 s carimbo · 40,46 s "torre bilionária desabou"
      ficha(35.86, "ATO IV · O COLAPSO", "CALOTE EM 11 DIAS");
      data(35.86, "18/AGO/2023");
      marca(35.86, "EMISSÕES PROMO", "SUSPENSAS");
      carimbo(38.14, "CALOTE", 57.37);
      data(40.46, "29/AGO/2023");
      valor(40.5, 42.6, 2.3, 0, { rotulo: "CRÉDITO DOS CLIENTES", delta: "▼ CALOTE", cor: FRAUDE, passos: 8 });

      // 43,22 s "setecentos mil credores" · 47,22 s "sócios foram indiciados" · 50,24 s "estelionato e fraude"
      ficha(43.22, "ATO V · O ESTRAGO", "700 MIL CREDORES");
      valor(43.3, 45.2, 0, 700, { rotulo: "CREDORES", delta: "▲", cor: FRAUDE, pico: 700, passos: 6, fmt: fmtMil });
      data(47.22, "CPI CÂMARA");
      marca(47.22, "RELATÓRIO DA CPI", "INDICIADOS", { barra: 1 });
      data(50.24, "INVESTIGADO");
      tl.set("#data-txt", { color: FRAUDE }, 50.35);
      tl.set("#hud-data", { borderColor: FRAUDE }, 50.35);
      tl.fromTo("#data-txt", { opacity: 1 }, { opacity: 0.2, duration: 0.16, yoyo: true, repeat: 7, ease: "steps(1)" }, 50.4);

      // 52,96 s "ironia final" · 55,52 s "apenas vouchers": o medidor volta ao pico em degraus
      ficha(52.96, "A IRONIA FINAL", "PAGOS EM VOUCHER");
      tl.set("#data-txt", { color: "#f2e8d5", opacity: 1 }, 52.96);
      tl.set("#hud-data", { borderColor: "#a3958a" }, 52.96);
      data(52.96, "VOUCHER");
      marca(52.96, "REEMBOLSO", "SÓ VOUCHER");
      valor(55.52, 58.5, 0, 2.3, { rotulo: "DÍVIDA DECLARADA", delta: "▼", cor: OURO, deltaCor: FRAUDE, passos: 8 });

      // Rebobinagem: selo, medidor e ficha remontam o quadro 0 (ficha idêntica em 59,77 − 0,6 s)
      data(57.6, "AGO/2023");
      quadroZero(58.6);
      ficha(DUR - 0.6, "CASO Nº 002 · 123MILHAS", "R$ 2,3 BI → ZERO");

      tl.set({}, {}, DUR);
      window.__timelines["hud"] = tl;
    })();
  </script>
