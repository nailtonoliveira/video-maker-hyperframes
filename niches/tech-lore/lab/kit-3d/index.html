<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>

    <style>
      :root {
        --ground: #080a0f;
        --ink: #e6edf3;
        --mint: #00ff9d;
        --alert: #ff3366;
        --cyan: #38bdf8;
        --gray: #7d8590;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-mono);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
