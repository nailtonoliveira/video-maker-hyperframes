  <script>
    (function () {
      // Tempo local: 0 = 17.80 s absoluto.
      const T0 = 17.8;
      const at = (abs) => +(abs - T0).toFixed(3);
      const tl = gsap.timeline({ paused: true });

      // Células de bits (decoração): 64 e 16.
      const fill = (sel, n) => {
        const host = document.querySelector(sel);
        for (let i = 0; i < n; i++) {
          const b = document.createElement("div");
          b.className = "s3-bit";
          host.appendChild(b);
        }
      };
      fill("#s3-float-bits", 64);
      fill("#s3-int-bits", 16);

      const blurIn = (sel, t, y = 40) =>
        tl.fromTo(sel, { opacity: 0, y, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);

      // "36 segundos" (18.08): chega de baixo, continuando o whip.
      blurIn("#s3-time-in", at(18.08), 90);

      // "computador" (20.24): a linha de código digitada até "converter" (21.40).
      blurIn("#s3-code-in", at(20.0), 20);
      const CH = 29, CW = 38 * 0.6;
      const ty = { n: 0 };
      const setType = () => {
        const hidden = (CH - Math.round(ty.n)) * CW;
        document.querySelector("#s3-code-text").style.clipPath = `inset(-10px ${hidden.toFixed(1)}px -10px 0)`;
      };
      setType();
      tl.fromTo(ty, { n: 0 }, { n: CH, duration: 1.16, ease: "none", onUpdate: setType }, at(20.24));

      // "64" (22.22) a caixa float64; "bits" (22.72) as 64 células acendem.
      blurIn("#s3-float", at(22.22), 30);
      tl.fromTo("#s3-float .s3-bit", { backgroundColor: "rgba(125,133,144,0.35)" }, { backgroundColor: "#38bdf8", duration: 0.05, stagger: 0.008, ease: "none" }, at(22.72));

      // "para" (24.66) a seta de conversão; "um inteiro" (24.90) a caixa int16; "16" (25.64) as 16 células.
      tl.fromTo("#s3-arrow-line", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, at(24.66));
      tl.fromTo("#s3-arrow-head", { opacity: 0 }, { opacity: 1, duration: 0.1 }, at(24.82));
      tl.fromTo("#s3-arrow-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, at(24.7));
      blurIn("#s3-int", at(24.9), 30);
      gsap.set("#s3-int-val, #s3-int-over", { opacity: 0 });
      tl.fromTo("#s3-int .s3-bit", { backgroundColor: "rgba(125,133,144,0.35)" }, { backgroundColor: "#38bdf8", duration: 0.05, stagger: 0.025, ease: "none" }, at(25.64));

      // O valor viaja do float64 para o int16 (25.90 → 26.35) e não cabe.
      tl.fromTo("#s3-ghost", { y: 0, scale: 1 }, { y: 330, duration: 0.45, ease: "power3.inOut" }, at(25.9));
      tl.set("#s3-ghost", { opacity: 0 }, at(26.35));
      tl.set("#s3-int-empty", { opacity: 0 }, at(26.35));
      tl.set("#s3-int-val", { opacity: 1 }, at(26.35));
      // "O número era grande demais" (26.60): tudo vermelho.
      tl.set("#s3-int", { borderColor: "#ff3366" }, at(26.6));
      tl.set("#s3-int-val", { color: "#ff3366" }, at(26.6));
      tl.set("#s3-int .s3-bit", { backgroundColor: "#ff3366" }, at(26.6));
      tl.set("#s3-int-max", { color: "#ff3366" }, at(26.6));
      tl.to("#s3-int .s3-val", { keyframes: { x: [0, 14, -12, 9, -6, 3, 0] }, duration: 0.4, ease: "none" }, at(26.6));

      // "número" (27.36): [OVERFLOW] + ERROR piscando.
      tl.set("#s3-int-val", { opacity: 0 }, at(27.36));
      tl.set("#s3-int-over", { opacity: 1 }, at(27.36));
      tl.set("#s3-error-tag", { opacity: 1 }, at(27.36));
      for (let i = 1; i <= 9; i++) {
        const t = at(27.36 + i * 0.13);
        const on = i % 2 === 0;
        tl.set("#s3-error-tag", { opacity: on ? 1 : 0.15 }, t);
        tl.set("#s3-int", { borderColor: on ? "#ff3366" : "rgba(255,51,102,0.25)" }, t);
      }
      tl.set("#s3-error-tag", { opacity: 1 }, at(27.36 + 10 * 0.13));
      tl.set("#s3-int", { borderColor: "#ff3366" }, at(27.36 + 10 * 0.13));

      // Saída em glitch (29.80): saltos de 1 frame, depois corte.
      const g = [
        [29.8, { x: 18, skewX: -6, opacity: 0.9 }],
        [29.834, { x: -24, skewX: 8, opacity: 0.6 }],
        [29.867, { x: 10, skewX: -3, opacity: 1 }],
        [29.9, { x: -30, skewX: 10, opacity: 0.5 }],
        [29.934, { x: 22, skewX: -8, opacity: 0.35 }],
        [29.967, { x: 0, skewX: 0, opacity: 0 }],
      ];
      tl.set("#s3-stage", { x: 0, skewX: 0, opacity: 1 }, 0);
      g.forEach(([t, v]) => tl.set("#s3-stage", v, at(t)));

      window.__timelines["s3"] = tl;
    })();
  </script>
