  <script>
    (function () {
      // Tempo local: 0 = 8.10 s absoluto.
      const T0 = 8.1;
      const at = (abs) => +(abs - T0).toFixed(3);
      const tl = gsap.timeline({ paused: true });

      // "ARIANE 5" letra a letra em "1996" (8.56); "— 1996" logo atrás.
      tl.fromTo(
        "#s2-name .ch",
        { opacity: 0.3, filter: "blur(6px)", y: 0 },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.05 },
        at(8.56),
      );
      tl.fromTo(
        "#s2-date .ch",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.05 },
        at(8.95),
      );

      // Linhas digitadas: ESA em "agência" (10.78), voo em "lançou" (12.18).
      const lines = [
        { id: "#s2-info-1", text: "org = ESA // Agência Espacial Europeia", start: 10.78, dur: 1.1 },
        { id: "#s2-info-2", text: "voo = V501 · 04/06/1996 · Kourou", start: 12.18, dur: 0.9 },
      ];
      lines.forEach((ln) => {
        const p = { n: 0 };
        tl.fromTo(
          p,
          { n: 0 },
          {
            n: ln.text.length,
            duration: ln.dur,
            ease: "none",
            onUpdate: () => {
              document.querySelector(ln.id).textContent = ln.text.slice(0, Math.round(p.n));
            },
          },
          at(ln.start),
        );
      });

      // Telemetria: ALT = 3.5 km · (t/36)², desenhada de "foguete" (12.80) até 15.10.
      const X0 = 60, X1 = 820, Y0 = 280, Y1 = 30;
      const pt = (p) => [X0 + (X1 - X0) * p, Y0 - (Y0 - Y1) * p * p];
      let d = "";
      for (let i = 0; i <= 60; i++) {
        const [x, y] = pt(i / 60);
        d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      const curve = document.querySelector("#s2-curve");
      curve.setAttribute("d", d);
      curve.setAttribute("pathLength", "100");
      curve.setAttribute("stroke-dasharray", "100 120");

      tl.fromTo("#s2-chart-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, at(12.6));
      const fl = { p: 0 };
      const setFlight = () => {
        const p = fl.p;
        curve.setAttribute("stroke-dashoffset", (110 - 110 * p).toFixed(2));
        const [x, y] = pt(Math.max(p, 0.0001));
        const [x2, y2] = pt(Math.min(p + 0.01, 1));
        const ang = (Math.atan2(y2 - y, x2 - x) * 180) / Math.PI + 90;
        document.querySelector("#s2-rocket").setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
        document.querySelector("#s2-ro-t").textContent = (36 * p).toFixed(1).padStart(4, "0") + " s";
        document.querySelector("#s2-ro-alt").textContent = (3.5 * p * p).toFixed(2) + " km";
      };
      setFlight();
      tl.fromTo(fl, { p: 0 }, { p: 1, duration: 2.3, ease: "power1.inOut", onUpdate: setFlight }, at(12.8));

      // 4 satélites conectando em "quatro" (15.02).
      tl.fromTo("#s2-payload-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, at(14.9));
      tl.fromTo(
        ".s2-sat",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.08 },
        at(15.02),
      );
      [1, 2, 3, 4].forEach((i) => {
        const t = at(15.3 + (i - 1) * 0.08);
        tl.set(`#s2-dot-${i}`, { backgroundColor: "#00ff9d" }, t);
        tl.set(`#s2-sat-${i}`, { borderColor: "#00ff9d" }, t);
      });

      // Saída em whip para cima: o próximo bloco chega de baixo.
      tl.to("#s2-stage", { y: -160, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, at(17.45));

      window.__timelines["s2"] = tl;
    })();
  </script>
