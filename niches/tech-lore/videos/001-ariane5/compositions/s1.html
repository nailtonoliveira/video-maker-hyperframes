      const money = (n) => "$" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const clock = (s) => "T+00:" + String(Math.floor(s)).padStart(2, "0");

      // Título já no frame 0 (thumbnail). Cursor de terminal pisca até o contador entrar.
      tl.set("#s1-caret", { opacity: 1 }, 0);
      for (let t = 0.5; t < 2.2; t += 0.5) {

      tl.set("#s1-caret", { opacity: 1 }, 2.2);
      // "linha" (1.62)

      const cost = { v: 0 };
      tl.fromTo(
        cost,
        { v: 0 },
        {
          v: 370000000,
          duration: 2.42,
          ease: "power3.out",
          onUpdate: () => {
            document.querySelector("#s1-cost-num").textContent = money(cost.v);
          },
        },
        2.42,
      );
      // Acerto ao pousar: 0 ms, depois assenta.
      tl.set("#s1-cost-num", { scale: 1.08, color: "#ffffff" }, 4.84);

      tl.fromTo("#s1-timer-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 5.5);
      const fly = { s: 0 };
      tl.fromTo(
        fly,
        { s: 0 },
        {
          s: 37,
          duration: 1.44,
          ease: "none",
          onUpdate: () => {
            document.querySelector("#s1-timer-val").textContent = clock(fly.s);
          },
        },
        5.88,
      );
      tl.set("#s1-timer-num", { color: "#ff3366" }, 7.32);
      tl.set("#s1-timer-tag", { opacity: 1 }, 7.32);
      tl.fromTo("#s1-timer-num", { x: -12 }, { x: 0, duration: 0.3, ease: "elastic.out(1, 0.4)" }, 7.32);
