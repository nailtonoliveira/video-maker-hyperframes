    (function () {
      // Tempo local: 0 = 30.00 s absoluto.
      const T0 = 30;
      const at = (abs) => +(abs - T0).toFixed(3);
      const tl = gsap.timeline({ paused: true });

      // Monitor entra logo após o glitch-cut.
      tl.fromTo("#s4-head", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0);
      tl.fromTo(["#s4-row-a-in", "#s4-row-b-in"], { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out", stagger: 0.08 }, 0.02);

      const crash = (row, ok, bad, t) => {
        tl.set(ok, { opacity: 0 }, t);
        tl.set(bad, { opacity: 1 }, t);
        tl.set(row, { borderColor: "#ff3366", backgroundColor: "rgba(255,51,102,0.16)" }, t);
        tl.to(row, { keyframes: { x: [0, 16, -14, 10, -6, 3, 0] }, duration: 0.35, ease: "none" }, t);
      };
      // "processador" (30.44) PRIMARY cai.
      crash("#s4-row-a-in", "#s4-a-ok", "#s4-a-bad", at(30.44));

      // Failover digitado logo depois de "travou" (31.88 → 32.26).
      const L1 = "> failover → BACKUP_CPU";
      gsap.set("#s4-log-1, #s4-log-2", { opacity: 0 });
      tl.set("#s4-log-1", { opacity: 1 }, at(31.0));
      tl.fromTo("#s4-log-1", { clipPath: "inset(-10px 100% -10px 0)" }, { clipPath: "inset(-10px 0% -10px 0)", duration: 0.6, ease: "steps(" + L1.length + ")" }, at(31.0));

      // "backup" (32.62) BACKUP cai também.
      crash("#s4-row-b-in", "#s4-b-ok", "#s4-b-bad", at(32.62));
      tl.set("#s4-log-fail", { opacity: 1 }, at(32.62));

      // "pelo mesmo erro" (34.50).
      tl.set("#s4-log-2", { opacity: 1 }, at(34.5));
      tl.fromTo("#s4-log-2", { filter: "blur(8px)", opacity: 0 }, { filter: "blur(0px)", opacity: 1, duration: 0.18, ease: "power4.out" }, at(34.5));

      // "Os motores" (35.94): o foguete no mostrador.
      tl.fromTo("#s4-dial", { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, at(35.8));
      tl.fromTo("#s4-read", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, at(35.94));

      // "viraram" (36.50): vira bruscamente para 90°.
      const ang = { a: 0 };
      const setAng = () => {
        document.querySelector("#s4-rocket").setAttribute("transform", `rotate(${ang.a.toFixed(2)} 210 210)`);
        document.querySelector("#s4-deg").textContent = Math.round(ang.a);
        document.querySelector("#s4-arc").setAttribute("stroke-dashoffset", (110 - (110 * ang.a) / 90).toFixed(2));
      };
      setAng();
      tl.fromTo(ang, { a: 0 }, { a: 90, duration: 0.38, ease: "expo.out", onUpdate: setAng }, at(36.5));
      tl.set("#s4-read-val", { color: "#ff3366" }, at(36.6));
      tl.set("#s4-vector", { attr: { stroke: "#ff3366" } }, at(36.6));
      tl.set("#s4-vector-head", { attr: { fill: "#ff3366" } }, at(36.6));
      // "máximo" (37.38).
      tl.set("#s4-read-max", { opacity: 1 }, at(37.38));

      // "se desintegrou" (39.00): flash e fragmentos.
      gsap.set("#s4-debris", { opacity: 0 });
      tl.set("#s4-rocket", { opacity: 0 }, at(39.0));
      tl.set("#s4-debris", { opacity: 1 }, at(39.0));
      const vec = [
        [-60, -150, -140], [40, 160, 200], [-170, 40, -260], [170, 30, 240],
        [10, -190, 90], [-120, 150, -180], [130, 140, 160], [0, 190, 320],
      ];
      document.querySelectorAll(".s4-frag").forEach((f, i) => {
        const [dx, dy, r] = vec[i];
        tl.fromTo(f, { x: 0, y: 0, rotation: 0, opacity: 1, transformOrigin: "50% 50%" }, { x: dx, y: dy, rotation: r, opacity: 0, duration: 1.1, ease: "expo.out" }, at(39.0));
      });
      tl.fromTo("#s4-flash", { opacity: 0 }, { opacity: 0.8, duration: 0.05, ease: "none" }, at(39.0));
      tl.to("#s4-flash", { opacity: 0, duration: 0.7, ease: "power2.out" }, at(39.05));
      tl.to(["#s4-row-a-in", "#s4-row-b-in", "#s4-log", "#s4-head"], { opacity: 0.35, duration: 0.3, ease: "power2.out" }, at(39.05));
      tl.set("#s4-read", { opacity: 0 }, at(39.0));
      tl.set("#s4-lost", { opacity: 1 }, at(39.6));

      // Saída para a cena 5.
      tl.to("#s4-stage", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, at(40.45));

      window.__timelines["s4"] = tl;
