<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Fundo","default":"#080a0f"},
    {"id":"ink","type":"color","label":"Texto","default":"#e6edf3"},
    {"id":"mint","type":"color","label":"Verde-menta","default":"#00ff9d"},
    {"id":"alert","type":"color","label":"Vermelho-alerta","default":"#ff3366"},
    {"id":"cyan","type":"color","label":"Ciano","default":"#38bdf8"},
    {"id":"gray","type":"color","label":"Cinza","default":"#7d8590"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #080a0f;
        --ink: #e6edf3;
        --mint: #00ff9d;
        --alert: #ff3366;
        --cyan: #38bdf8;
        --gray: #7d8590;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-mono);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- Duração = locução. Depois de transcrever: tools/set_duration.py <pasta do vídeo> -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <!-- Mundo 3D (motor + kit + assets/episode/scene.js) e títulos 2D -->
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- Legendas: geradas por tools/build_captions.py -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="12"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <!-- Locução -->
      <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="10" data-volume="1.18"></audio>

      <!-- Trilha procedural: tools/.venv/bin/python shared/trilha/trilha.py <vídeo> gera estes wavs de assets/episode/trilha.json -->
      <audio id="ambiente" class="clip" src="assets/audio/ambiente.wav" data-start="0" data-duration="12" data-track-index="20" data-volume="0.32"></audio>
      <audio id="music" class="clip" src="assets/audio/musica.wav" data-start="0" data-duration="12" data-track-index="21" data-volume="0.16"></audio>
      <audio id="efeitos" class="clip" src="assets/audio/efeitos.wav" data-start="0" data-duration="12" data-track-index="22" data-volume="0.9"></audio>

      <!-- SFX (assets/sfx/): cada início = momento da imagem + 1 quadro − pico do arquivo. Exemplo: corte do mergulho (4,4 s) -->
      <audio id="sfx-dive" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.27" data-duration="0.57" data-track-index="30" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
