  </style>

  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
    <div id="vignette" data-layout-ignore></div>

    <div id="hud-watermark" data-layout-ignore>
      <div id="hud-wm-dot">*</div>
      <div id="hud-wm-text" data-var-text="brand">ia-lab.dev</div>

    <div id="hud-tape-wrap" data-layout-allow-overflow>
      <div id="hud-paper-strip">
        <div id="hud-led" data-layout-ignore></div>
        <div id="hud-banner-text">O GOLPE DOS 3 SEGUNDOS</div>
        <div id="screw-tl" class="hud-screw" data-layout-ignore></div>
        <div id="screw-tr" class="hud-screw" data-layout-ignore></div>
        <div id="screw-bl" class="hud-screw" data-layout-ignore></div>

      </div>

    <div id="hud-score-card">
      <div id="hud-score-label">AMOSTRA</div>
      <div id="hud-score-val">3s</div>
    </div>

    <div id="hud-cta-modal">
      <div id="hud-cta-eyebrow">BLUEPRINT COMPLETO</div>
      <div id="hud-cta-title">ACESSO AO SISTEMA</div>
      <div id="hud-cta-pill">&gt; /ia-lab</div>
    </div>
  </div>

  <script>
    (function () {
      const DUR = 39.66;
      const THEME = "amber"; // "amber" | "clean-lab" | "olive-copper" | "obsidian-mint"
      const SHOW_WATERMARK = false;
      const WATERMARK_TEXT = "ia-lab.dev";
      const tl = gsap.timeline({ paused: true });

      if (SHOW_WATERMARK) {
        tl.set("#hud-watermark", { display: "flex" }, 0);
        tl.set("#hud-wm-text", { textContent: WATERMARK_TEXT }, 0);
      } // senão: o CSS já deixa #hud-watermark em display:none desde o frame 0

      const HUD_THEMES = {
        amber: {
          stripBg: "linear-gradient(180deg, #292524 0%, #171514 100%)",
          stripColor: "#1c1917",
          stripBorder: "#78716c",
          bannerText: "#f8fafc",
          scoreBg: "linear-gradient(180deg, #262321 0%, #141211 100%)",
          scoreColor: "#181615",
          scoreBorder: "#78716c",
          scoreLabel: "#e7e5e4",
          dotBg: "#fbbf24",
          dotFg: "#141414",
        },
        "clean-lab": {
          stripBg: "linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%)",
          stripColor: "#f1f5f9",
          stripBorder: "#1e293b",
          bannerText: "#0f172a",
          scoreBg: "linear-gradient(180deg, #1e293b 0%, #0f172a 100%)",
          scoreColor: "#162032",
          scoreBorder: "#f97316",
          scoreLabel: "#f8fafc",
          dotBg: "#f97316",
          dotFg: "#ffffff",
        },
        "olive-copper": {
          stripBg: "linear-gradient(180deg, #243027 0%, #131a15 100%)",
          stripColor: "#18211b",
          stripBorder: "#b45309",
          bannerText: "#f8fafc",
          scoreBg: "linear-gradient(180deg, #1f2a22 0%, #101612 100%)",
          scoreColor: "#161e18",
          scoreBorder: "#b45309",
          scoreLabel: "#e7e5e4",
          dotBg: "#d97706",
          dotFg: "#ffffff",
        },
        "obsidian-mint": {
          stripBg: "linear-gradient(180deg, #222228 0%, #111115 100%)",
          stripColor: "#16161b",
          stripBorder: "#52525b",
          bannerText: "#f8fafc",
          scoreBg: "linear-gradient(180deg, #1e1e24 0%, #0e0e12 100%)",
          scoreColor: "#141418",
          scoreBorder: "#10b981",
          scoreLabel: "#e4e4e7",
          dotBg: "#10b981",
          dotFg: "#06140e",
        },
      };

      const ht = HUD_THEMES[THEME] || HUD_THEMES.amber;
      tl.set(
        "#hud-paper-strip",
        { backgroundImage: ht.stripBg, backgroundColor: ht.stripColor, borderColor: ht.stripBorder },
        0
      );
      tl.set("#hud-banner-text", { color: ht.bannerText }, 0);
      tl.set(
        "#hud-score-card",
        { backgroundImage: ht.scoreBg, backgroundColor: ht.scoreColor, borderColor: ht.scoreBorder },
        0
      );
      tl.set("#hud-score-label", { color: ht.scoreLabel }, 0);
      tl.set("#hud-wm-dot", { backgroundColor: ht.dotBg, color: ht.dotFg }, 0);

      // Normaliza qualquer cor passada para versões LED de alto contraste WCAG AA
      function toLedColor(c) {
        const s = String(c || "").toLowerCase();
        if (s.includes("c92a2a") || s.includes("e74c3c") || s.includes("ef4444") || s.includes("ff")) return "#ff6b6b";
        if (s.includes("18864b") || s.includes("2ecc71") || s.includes("22c55e") || s.includes("4ade80")) return "#4ade80";
        if (s.includes("b45309") || s.includes("f39c12") || s.includes("f59e0b") || s.includes("fbbf24")) return "#fbbf24";
        return "#38bdf8";
      }

      // Helpers de HUD presos às âncoras da locução
      function setBanner(text, t) {
        tl.fromTo(
          "#hud-paper-strip",
          { scale: 0.95, y: -6 },
          { scale: 1, y: 0, duration: 0.22, ease: "back.out(2.2)" },
          t
        );
        tl.set("#hud-banner-text", { textContent: text }, t);
      }

      function setScore(label, val, colorHex, t) {
        const led = toLedColor(colorHex);
        tl.set("#hud-score-label", { textContent: label }, t);
        tl.set("#hud-score-val", { textContent: String(val), color: led }, t);
        tl.set("#hud-led", { backgroundColor: led, boxShadow: "0 0 16px " + led }, t);
        tl.fromTo(
          "#hud-score-val",
          { scale: 1.35 },
          { scale: 1, duration: 0.26, ease: "back.out(2.4)" },
          t
        );
      }

      // Âncoras = início da palavra em assets/voice.json
      const T = {
        post: 4.04, // "posta um story inocente"
        s2: 6.76, // "A inteligência artificial"
        slice: 9.32, // "fatia seu tom"
        breath: 10.4, // "respiração"
        learn: 11.74, // "aprende a falar"
        s3: 13.42, // "Só que aí"
        villain: 14.2, // "entra o golpista"
        whats: 16.98, // "WhatsApp"
        family: 17.68, // "família"
        pix: 19.6, // "pedindo PIX urgente"
        s4: 21.18, // "No pânico"
        cry: 21.84, // "ouvir o parente chorando"
        transfer: 24.96, // "transfere sem pensar"
        s5: 26.56, // "Então"
        protect: 27.1, // "a proteção é simples"
        secret: 29.4, // "uma palavra secreta"
        s6: 33.04, // "Se quem ligou"
        hangup: 34.9, // "desliga na hora"
        zero: 37.14, // "o golpe zera"
      };
      const LED = { amber: "#fbbf24", cyan: "#38bdf8", red: "#ff6b6b", green: "#4ade80" };

      // Cena 1 (0.00–6.76): Gancho — frame 0 limpo (sem pop) para a thumbnail
      tl.set("#hud-banner-text", { textContent: "O GOLPE DOS 3 SEGUNDOS" }, 0);
      tl.set("#hud-score-label", { textContent: "AMOSTRA" }, 0);
      tl.set("#hud-score-val", { textContent: "3s", color: LED.amber }, 0);
      tl.set("#hud-led", { backgroundColor: LED.amber, boxShadow: "0 0 16px " + LED.amber }, 0);

      // Cena 2 (6.76–13.42): O Fatiador de Voz
      setBanner("FATIANDO SUA VOZ", T.slice);
      setScore("CLONE", "33%", LED.cyan, T.slice);
      setScore("CLONE", "66%", LED.cyan, T.breath);
      setScore("CLONE", "100%", LED.cyan, T.learn);

      // Cena 3 (13.42–21.18): "Só que..." — O Droide Impostor
      setBanner("O IMPOSTOR NO WHATSAPP", T.villain);
      setScore("PERIGO", "40%", LED.amber, T.villain);
      setScore("PERIGO", "60%", LED.amber, T.whats);
      setScore("PERIGO", "90%", LED.red, T.pix);

      // Cena 4 (21.18–26.56): O Desespero Humano
      setBanner("PÂNICO E PIX FALSO", T.cry);
      setScore("ERROS", "1", LED.red, T.transfer);

      // Cena 5 (26.56–33.04): "Então..." — A Palavra Secreta
      setBanner("A PALAVRA SECRETA", T.protect);
      setScore("SENHA", "ATIVA", LED.green, T.secret);

      // Cena 6 (33.04–39.66): O Veredito (sem CTA: #hud-cta-modal fica em opacity 0)
      setBanner("SEM A SENHA? DESLIGA", T.s6);
      setBanner("GOLPE ANULADO", T.zero);
      setScore("ERROS", "0", LED.green, T.zero);

      tl.set({}, {}, DUR);
      window.__timelines["world"] = tl;

      // ---------- Mundo 3D (Three.js + kit3d.js): função pura de t ----------
      let api = null;
      let lastT = 0;
      const ready = Promise.all([
        import("https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js"),
        import("../assets/kit3d.js"),
        document.fonts.load('900 48px "Inter"'),
        document.fonts.load('700 28px "JetBrains Mono"'),
      ]).then(([THREE, KIT]) => {
        api = buildScene(THREE, KIT);
        api.render(lastT);
      });

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = ready;

      window.addEventListener("hf-seek", (e) => {
        lastT = e.detail.time;
        if (api) api.render(lastT);
        else e.detail.waitUntil(ready);
      });

      function buildScene(THREE, KIT) {
        const {
          PALETTE,
          E,
          seg,
          shake,
          hash,
          solid,
          createMaterials,
          createDioramaStage,
          createBlockAgent,
          createCodeScreen,
          createFlowArrow,
          createFloatingLabel,
          applyCameraShot,
        } = KIT;
        const stage = createDioramaStage(THREE, document.getElementById("gl"), THEME);
        const { scene, cam, sky, renderer, updateStage } = stage;
        const M = createMaterials(THREE);

        // ---------- Helpers puros de t ----------
        const lerp = (a, b, k) => a + (b - a) * k;
        const inK = (t, t0, d = 0.45) => E.backOut(seg(t, t0, t0 + d));
        const outK = (t, t1, d = 0.35) => (t1 == null ? 1 : 1 - E.p2in(seg(t, t1, t1 + d)));
        // Entra com backOut em t0, sai encolhendo em t1 (null = fica até o fim)
        function life(obj, t, t0, t1, base = 1) {
          obj.visible = t >= t0 && (t1 == null || t < t1 + 0.35);
          obj.scale.setScalar(Math.max(0.001, base * inK(t, t0) * outK(t, t1)));
        }

        // ---------- Monitor industrial: uma tela por cena ----------
        function makeScreen(title, lines) {
          const s = createCodeScreen(THREE, { title, lines, width: 3.6, height: 2.4, theme: THEME });
          s.group.position.set(0, 2.45, -2.1);
          s.group.visible = false;
          scene.add(s.group);
          return s;
        }
        const SCREENS = [
          {
            a: 0,
            s: makeScreen("audio_story.wav", [
              "▁▃▆█▅▂▇█▄▁▃▆  00:03",
              "origem = 'instagram'",
              "duracao = 3  # segundos",
              "quem_ve = 'TODO MUNDO'",
            ]),
            state: (t) => (t < T.post ? ["normal", -1, ""] : ["ok", 0, "POSTADO"]),
          },
          {
            a: T.s2,
            s: makeScreen("clonador_voz.py", [
              "amostra = fatiar(audio, 3)",
              "tom, respiro, ritmo = amostra",
              "clone.aprender(amostra)",
              "clone.falar('qualquer frase')",
            ]),
            state: (t) =>
              t < T.slice ? ["normal", -1, ""] : t < T.learn ? ["normal", 0, ""] : ["ok", 3, "CLONE 100%"],
          },
          {
            a: T.s3,
            s: makeScreen("whatsapp_familia", [
              "de: 'FILHO' (voz clonada)",
              "> mãe, me sequestraram!",
              "> manda PIX urgente!!",
              "chave_pix = golpista",
            ]),
            state: (t) =>
              t < T.villain ? ["error", -1, ""] : t < T.pix ? ["error", 1, "GOLPE"] : ["error", 2, "PIX URGENTE"],
          },
          {
            a: T.s4,
            s: makeScreen("banco_familia", [
              "> SOCORRO! me ajuda!",
              "conferir_numero()  # PULOU",
              "PIX: R$ 3.000 ENVIADO",
              "saldo = R$ 0",
            ]),
            state: (t) => {
              if (t < T.transfer) return ["error", 0, "SOCORRO!"];
              const on = Math.floor((t - T.transfer) / 0.2) % 2 === 0;
              return on ? ["error", 2, "PIX ENVIADO"] : ["normal", -1, ""];
            },
          },
          {
            a: T.s5,
            s: makeScreen("protecao_familia.py", [
              "senha = combinar_hoje()",
              "so_a_familia_sabe(senha)",
              "se ligacao.pede_pix:",
              "    perguntar(senha)",
            ]),
            state: (t) => (t < T.secret ? ["normal", -1, ""] : ["ok", 0, "SENHA ATIVA"]),
          },
          {
            a: T.s6,
            s: makeScreen("verificador.py", [
              "se nao_sabe(senha):",
              "    desligar()  # na hora",
              "golpe = ANULADO",
              "AMEAÇA: ZERO",
            ]),
            state: (t) =>
              t < T.hangup ? ["normal", 0, ""] : t < T.zero ? ["ok", 1, "DESLIGOU"] : ["ok", 3, "AMEAÇA: ZERO"],
          },
        ];
        SCREENS.forEach((sc) => (sc.key = ""));

        // ---------- Droides (kit3d.js) ----------
        const user = createBlockAgent(THREE, { role: "user", color: PALETTE.cyan, scale: 0.95, labelText: "VOCÊ" });
        scene.add(user.group);
        const coder = createBlockAgent(THREE, { role: "coder", color: 0xeab308, scale: 0.95, labelText: "IA DE VOZ" });
        coder.group.position.set(1.3, 0, 1.0);
        coder.group.rotation.y = -0.3;
        scene.add(coder.group);
        const hacker = createBlockAgent(THREE, { role: "hacker", color: PALETTE.red, scale: 0.95, labelText: "GOLPISTA" });
        scene.add(hacker.group);
        const boss = createBlockAgent(THREE, { role: "boss", color: PALETTE.orange, scale: 0.95, labelText: "FAMÍLIA" });
        boss.group.position.set(-1.3, 0, 1.0);
        boss.group.rotation.y = 0.3;
        scene.add(boss.group);

        // Celular na mão direita do VOCÊ (primitivas solid do kit)
        const phone = solid(THREE, new THREE.BoxGeometry(0.24, 0.42, 0.05), M.fill(0x18181b, 0.35, 0.6), M.darkEdge);
        const phoneScreenMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
        const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.19, 0.34), phoneScreenMat);
        phoneScreen.position.z = 0.03;
        phone.add(phoneScreen);
        phone.position.set(0, -0.56, 0.06);
        user.armR.add(phone);

        // ---------- Fatiador de voz: onda 3D de 12 barras que vira 3 blocos ----------
        const slicer = new THREE.Group();
        slicer.position.set(0, 0.25, 1.4);
        scene.add(slicer);
        const slicerBase = solid(THREE, new THREE.BoxGeometry(1.7, 0.14, 0.5), M.fill(0x27272a, 0.4, 0.6), M.lightEdge);
        slicerBase.position.y = 0.07;
        slicer.add(slicerBase);

        const CHUNK_COLORS = [PALETTE.cyan, PALETTE.amber, PALETTE.purple];
        const chunkMats = CHUNK_COLORS.map(() => {
          const m = M.fill(PALETTE.green, 0.35, 0.3);
          m.emissive = new THREE.Color(PALETTE.green);
          m.emissiveIntensity = 0.35;
          return m;
        });
        const barGeom = new THREE.BoxGeometry(0.085, 1, 0.16);
        const bars = [];
        for (let i = 0; i < 12; i++) {
          const c = Math.floor(i / 4);
          const mesh = new THREE.Mesh(barGeom, chunkMats[c]);
          mesh.castShadow = true;
          slicer.add(mesh);
          bars.push({ mesh, c, x: (i - 5.5) * 0.11, h: 0.14 + 0.5 * hash(i, 3), ph: i * 1.7 });
        }

        const bladeMat = M.fill(PALETTE.amber, 0.3, 0.7);
        bladeMat.emissive = new THREE.Color(0x7c4a03);
        const blades = new THREE.Group();
        [-0.22, 0.22].forEach((x) => {
          const b = solid(THREE, new THREE.BoxGeometry(0.035, 0.42, 0.34), bladeMat, M.darkEdge);
          b.position.x = x;
          blades.add(b);
        });
        slicer.add(blades);

        const chunkLabels = [
          ["TOM", T.slice + 0.5],
          ["RESPIRO", T.breath],
          ["RITMO", T.breath + 0.56],
        ].map(([txt, t0], c) => {
          const css = "#" + new THREE.Color(CHUNK_COLORS[c]).getHexString();
          const lbl = createFloatingLabel(THREE, txt, { bg: "#18181b", fg: "#f8fafc", border: css, worldH: 0.15 });
          lbl.userData.t0 = t0;
          slicer.add(lbl);
          return lbl;
        });

        // Seta âmbar: dados da voz → sintetizador (monitor)
        const amberArrow = createFlowArrow(THREE, { color: PALETTE.amber, length: 0.8, thickness: 0.15 });
        const amberHolder = new THREE.Group();
        amberHolder.add(amberArrow.group);
        amberHolder.position.set(0, 1.4, 1.4);
        amberHolder.rotation.z = Math.PI / 2;
        scene.add(amberHolder);

        // Seta vermelha: golpista → família
        const redArrow = createFlowArrow(THREE, { color: PALETTE.red, length: 1.1, thickness: 0.2 });
        const redHolder = new THREE.Group();
        redHolder.add(redArrow.group);
        redHolder.position.set(0.55, 1.15, 1.35);
        redHolder.rotation.y = Math.PI;
        scene.add(redHolder);

        // ---------- Cadeado metálico (escudo da palavra secreta) ----------
        const lock = new THREE.Group();
        lock.position.set(0.05, 0, 1.0);
        scene.add(lock);
        const lockInner = new THREE.Group();
        lock.add(lockInner);
        const lockBody = solid(THREE, new THREE.BoxGeometry(0.9, 0.72, 0.38), M.fill(0xd6d3d1, 0.38, 0.85), M.darkEdge);
        lockBody.position.y = 0.36;
        const chromeMat = M.fill(0xe2e8f0, 0.32, 0.9);
        const shackle = solid(THREE, new THREE.TorusGeometry(0.28, 0.075, 12, 28, Math.PI), chromeMat);
        shackle.position.y = 0.86;
        const legGeom = new THREE.CylinderGeometry(0.075, 0.075, 0.16, 12);
        const legL = solid(THREE, legGeom, chromeMat);
        legL.position.set(-0.28, 0.79, 0);
        const legR = solid(THREE, legGeom, chromeMat);
        legR.position.set(0.28, 0.79, 0);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x09090b });
        const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.02, 16), holeMat);
        hole.rotation.x = Math.PI / 2;
        hole.position.set(0, 0.42, 0.195);
        const slot = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.02), holeMat);
        slot.position.set(0, 0.32, 0.195);
        const lockLedMat = new THREE.MeshBasicMaterial({ color: PALETTE.amber });
        const lockLed = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.06, 0.02), lockLedMat);
        lockLed.position.set(0, 0.6, 0.195);
        lockInner.add(lockBody, shackle, legL, legR, hole, slot, lockLed);

        // Placa dourada com a palavra secreta, erguida pela FAMÍLIA
        const goldPlate = createFloatingLabel(THREE, "SENHA: ****", {
          bg: "#fbbf24",
          fg: "#141414",
          border: "#78350f",
          worldH: 0.2,
        });
        goldPlate.position.set(-0.62, 1.2, 1.5);
        scene.add(goldPlate);

        // ---------- Planos de câmera (um por cena) ----------
        const SHOTS = [
          { a: 0, b: T.s2, p0: [0, 4.8, 10.2], p1: [0.2, 4.3, 8.8], l0: [0, 1.75, -0.4], l1: [0, 1.7, -0.2], ease: "p2io" },
          { a: T.s2, b: T.s3, p0: [-0.6, 4.9, 9.8], p1: [0.4, 4.5, 9.2], l0: [0, 1.65, 0], l1: [0.1, 1.6, 0.1], ease: "p2io" },
          { a: T.s3, b: T.s4, p0: [1.0, 5.4, 10.8], p1: [0, 4.8, 10.0], l0: [0.1, 1.75, -0.3], l1: [0, 1.7, -0.2], ease: "p2out" },
          { a: T.s4, b: T.s5, p0: [-0.2, 4.4, 9.4], p1: [-0.5, 3.9, 8.2], l0: [-0.3, 1.75, -0.2], l1: [-0.4, 1.75, 0], ease: "p2io" },
          { a: T.s5, b: T.s6, p0: [0, 5.8, 10.6], p1: [0.1, 4.8, 9.9], l0: [0, 1.5, 0], l1: [0.1, 1.65, 0], ease: "p2out" },
          { a: T.s6, b: DUR + 0.01, p0: [0.15, 4.6, 9.7], p1: [0.05, 4.8, 10.4], l0: [0.1, 1.7, 0], l1: [0.05, 1.75, -0.4], ease: "p2io" },
        ];

        function render(t) {
          updateStage(t, t >= T.s3 && t < T.protect ? 0.85 : 0);

          // Monitor: tela da cena atual + "liga" com squash ao trocar
          let cur = 0;
          SCREENS.forEach((sc, i) => {
            if (t >= sc.a) cur = i;
          });
          SCREENS.forEach((sc, i) => {
            sc.s.group.visible = i === cur;
            if (i !== cur) return;
            const st = sc.state(t);
            const key = st.join("|");
            if (key !== sc.key) {
              sc.key = key;
              sc.s.draw(st[0], st[1], st[2]);
            }
            const on = sc.a > 0 ? E.backOut(seg(t, sc.a, sc.a + 0.22)) : 1;
            sc.s.group.scale.set(1, Math.max(0.02, on), 1);
          });

          // VOCÊ: centro na cena 1 → esquerda na cena 2 → sai; volta no veredito no lugar do golpista
          if (t < T.zero) {
            const k = E.p2io(seg(t, T.s2, T.s2 + 0.6));
            user.group.position.set(lerp(0, -1.3, k), 0, lerp(1.2, 1.0, k));
            user.group.rotation.y = 0.3 * k;
            life(user.group, t, -1, T.s3, 0.95);
          } else {
            user.group.position.set(1.45, 0, 1.05);
            user.group.rotation.y = -0.3;
            life(user.group, t, T.zero, null, 0.95);
          }
          user.act(t, t < T.post ? "idle" : t < T.s2 ? "point" : t < T.zero ? "idle" : "celebrate", 0.4);
          const recOn = t >= T.post && t < T.s2 && Math.floor((t - T.post) * 2) % 2 === 0;
          phoneScreenMat.color.setHex(t < T.post ? 0x1e293b : recOn ? PALETTE.red : 0x22c55e);

          // IA DE VOZ (coder) + fatiador
          life(coder.group, t, T.s2, T.s3, 0.95);
          coder.act(t, t < T.slice ? "idle" : t < T.learn ? "point" : "type", 1.3);
          life(slicer, t, T.s2, T.s3, 1);

          const sliced = t >= T.slice + 0.05;
          const kS = E.backOut(seg(t, T.slice + 0.05, T.slice + 0.45));
          chunkMats.forEach((m, c) => {
            const col = sliced ? CHUNK_COLORS[c] : PALETTE.green;
            m.color.setHex(col);
            m.emissive.setHex(col);
          });
          bars.forEach((b) => {
            const live = sliced ? 1 : 0.7 + 0.3 * Math.sin(t * 9 + b.ph);
            const h = b.h * live;
            const lift = 0.12 * kS;
            b.mesh.scale.y = h;
            b.mesh.position.set(b.x + (b.c - 1) * 0.16 * kS, 0.14 + h / 2 + lift, 0);
          });
          blades.visible = t >= T.slice - 0.35 && t < T.slice + 0.6;
          blades.position.y =
            t < T.slice
              ? 1.6 - 1.25 * E.p2in(seg(t, T.slice - 0.2, T.slice))
              : 0.35 + 1.25 * E.p2io(seg(t, T.slice + 0.15, T.slice + 0.6));
          chunkLabels.forEach((lbl, c) => {
            lbl.position.set((c - 1) * (0.44 + 0.16), 1.02, 0.05);
            life(lbl, t, lbl.userData.t0, T.learn, 1);
          });

          life(amberHolder, t, T.learn, T.s3, 1);
          amberArrow.pulse(t, 10, 0.12);

          // GOLPISTA: entra com >_<, digita, aponta para a família, entra em pânico com o cadeado, é ejetado
          const kE = seg(t, T.hangup + 0.1, T.hangup + 1.0);
          hacker.group.position.set(1.3 + 3.4 * kE, 3.0 * kE - 4.0 * kE * kE, 1.0);
          hacker.group.rotation.set(0, -0.3, -5 * kE);
          life(hacker.group, t, T.villain, null, 0.95);
          if (kE >= 1) hacker.group.visible = false;
          hacker.act(
            t,
            t < T.villain + 1.16 ? "panic" : t < T.pix ? "type" : t < T.protect ? "point" : "panic",
            2.1
          );

          // FAMÍLIA
          life(boss.group, t, T.family, null, 0.95);
          boss.act(
            t,
            t < T.cry
              ? "idle"
              : t < T.s5
              ? "panic"
              : t < T.secret
              ? "idle"
              : t < T.hangup
              ? "point"
              : t < T.zero
              ? "stamp"
              : "celebrate",
            3.7
          );

          // Seta vermelha (golpe) — o cadeado corta a seta quando pousa
          life(redHolder, t, T.pix, T.protect + 0.3, 1);
          redArrow.pulse(t, 14, 0.18);

          // Cadeado: cai, pousa com squash backOut, LED verde na senha
          lock.visible = t >= T.protect;
          const kFall = E.p2in(seg(t, T.protect, T.protect + 0.3));
          lock.position.y = 2.8 * (1 - kFall);
          const kLand = E.backOut(seg(t, T.protect + 0.3, T.protect + 0.65));
          const landed = t >= T.protect + 0.3;
          lockInner.scale.set(landed ? lerp(1.25, 1, kLand) : 1, landed ? lerp(0.6, 1, kLand) : 1, landed ? lerp(1.25, 1, kLand) : 1);
          lockLedMat.color.setHex(t >= T.secret ? PALETTE.green : PALETTE.amber);

          // Placa dourada
          life(goldPlate, t, T.secret, null, 1);
          goldPlate.position.y = 0.95 + 0.25 * E.p2out(seg(t, T.secret, T.secret + 0.5));

          // Câmera + shakes nos gargalos e nos impactos
          const camShake =
            shake(t, T.s3, 0.14, 0.35) +
            shake(t, T.pix, 0.1, 0.3) +
            shake(t, T.transfer, 0.12, 0.35) +
            shake(t, T.protect + 0.3, 0.08, 0.3) +
            shake(t, T.hangup, 0.1, 0.3);
          applyCameraShot(THREE, cam, sky, SHOTS, t, camShake);

          renderer.render(scene, cam);
        }

        return { render };
      }
    })();
  </script>
</template>
