<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Fundo","default":"#121214"},
    {"id":"paper","type":"color","label":"Placa Metálica","default":"#1c1917"},
    {"id":"ink","type":"color","label":"Texto","default":"#f8fafc"},
    {"id":"claude","type":"color","label":"Âmbar Ouro","default":"#fbbf24"},
    {"id":"alert","type":"color","label":"LED Vermelho","default":"#ff6b6b"},
    {"id":"ok","type":"color","label":"LED Verde","default":"#4ade80"},
    {"id":"brand","type":"string","label":"Marca","default":"ia-lab.dev"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #121214;
        --paper: #1c1917;
        --ink: #f8fafc;
        --claude: #fbbf24;
        --alert: #ff6b6b;
        --ok: #4ade80;
        --font-sans: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-sans);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- Duração = locução. Depois de transcrever: tools/set_duration.py <pasta do vídeo> -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="39.66"
      data-width="1080"
      data-height="1920"
    >
      <!-- Mundo 3D (Oficina Grafite & Âmbar + Droides Cápsula) + HUD Placa Metálica Industrial -->
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="39.66"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- Legendas: geradas por tools/build_captions.py (estilo dark-pill) -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="39.66"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <!-- Locução -->
      <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="10" data-volume="1.18"></audio>

      <!-- SFX (assets/sfx/): início = momento da imagem + 1 frame − pico do arquivo
           (picos: whoosh-short 0.162 · pop 0.119 · error 0.739 · impact-bass-1 0.073 · click 0.072 · ping 0.323 · key-press 0.077) -->
      <!-- Cena 1: 4.04 "posta" (celular grava) -->
      <audio id="sfx-rec" class="clip" src="assets/sfx/click.mp3" data-start="4.001" data-duration="0.36" data-track-index="11" data-volume="0.4"></audio>
      <!-- Cena 2: 6.76 entra IA DE VOZ · 9.32 "fatia" · 11.74 "aprende" -->
      <audio id="sfx-s2-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.631" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-s2-pop" class="clip" src="assets/sfx/pop.mp3" data-start="6.674" data-duration="0.72" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-slice-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.191" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-slice-cut" class="clip" src="assets/sfx/click.mp3" data-start="9.281" data-duration="0.36" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-learn-key" class="clip" src="assets/sfx/key-press.mp3" data-start="11.696" data-duration="0.4" data-track-index="11" data-volume="0.4"></audio>
      <!-- Cena 3: 13.42 "Só que" · 14.20 golpista entra · 17.68 família entra · 19.60 "pedindo PIX" -->
      <audio id="sfx-s3-err" class="clip" src="assets/sfx/error.mp3" data-start="12.714" data-duration="1.62" data-track-index="14" data-volume="1.8"></audio>
      <audio id="sfx-s3-bass" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="13.38" data-duration="2.11" data-track-index="15" data-volume="0.24"></audio>
      <audio id="sfx-villain-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="14.071" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-villain-pop" class="clip" src="assets/sfx/pop.mp3" data-start="14.114" data-duration="0.72" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-family-pop" class="clip" src="assets/sfx/pop.mp3" data-start="17.594" data-duration="0.72" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-pix-err" class="clip" src="assets/sfx/error.mp3" data-start="18.894" data-duration="1.62" data-track-index="14" data-volume="1.8"></audio>
      <audio id="sfx-pix-bass" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="19.56" data-duration="2.11" data-track-index="15" data-volume="0.24"></audio>
      <!-- Cena 4: 21.84 "ouvir" · 24.96 "transfere" -->
      <audio id="sfx-s4-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="21.711" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-sent-err" class="clip" src="assets/sfx/error.mp3" data-start="24.254" data-duration="1.62" data-track-index="14" data-volume="1.8"></audio>
      <audio id="sfx-sent-bass" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="24.92" data-duration="2.11" data-track-index="15" data-volume="0.24"></audio>
      <!-- Cena 5: 27.10 cadeado cai (pousa 27.40) · 29.40 "palavra secreta" -->
      <audio id="sfx-s5-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="26.971" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-lock-land" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="27.36" data-duration="2.11" data-track-index="15" data-volume="0.3"></audio>
      <audio id="sfx-secret-ping" class="clip" src="assets/sfx/ping.mp3" data-start="29.11" data-duration="1.32" data-track-index="16" data-volume="0.5"></audio>
      <!-- Cena 6: 33.04 faixa · 34.90 "desliga" (carimbo + ejeção) · 37.14 "o golpe zera" -->
      <audio id="sfx-s6-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="32.911" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="34.86" data-duration="2.11" data-track-index="15" data-volume="0.3"></audio>
      <audio id="sfx-eject" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="34.904" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-zero-ping" class="clip" src="assets/sfx/ping.mp3" data-start="36.85" data-duration="1.32" data-track-index="16" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
