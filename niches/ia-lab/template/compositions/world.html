<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: var(--ground);
      overflow: hidden;
      font-family: var(--font-sans);
    }
    #gl {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }
    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 92% 78% at 50% 48%,
        rgba(12, 12, 14, 0) 54%,
        rgba(8, 8, 10, 0.52) 100%
      );
      pointer-events: none;
    }

    /* 1. Watermark Industrial no topo direito (oculto por padrão; ativado com --marca) */
    #hud-watermark {
      position: absolute;
      top: 96px;
      right: 76px;
      display: none;
      align-items: center;
      gap: 12px;
      background: #141417;
      border: 2px solid #52525b;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }
    #hud-wm-dot {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #141414;
      font-weight: 900;
      font-size: 16px;
    }
    #hud-wm-text {
      color: #f8fafc;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* 2. Placa Metálica Industrial Superior (Chapa com Parafusos e LED) */
    #hud-tape-wrap {
      position: absolute;
      left: 56px;
      top: 196px;
      width: 968px;
      height: 118px;
    }
    #hud-paper-strip {
      position: absolute;
      inset: 0;
      background-color: #1c1917;
      background-image: linear-gradient(180deg, #292524 0%, #171514 100%);
      border: 4px solid #78716c;
      border-radius: 14px;
      box-shadow: 0 9px 0 #09090b, 0 18px 30px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 0 44px;
    }
    #hud-led {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fbbf24;
      border: 3px solid #09090b;
      box-shadow: 0 0 16px #fbbf24;
      flex-shrink: 0;
    }
    #hud-banner-text {
      color: #f8fafc;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }
    .hud-screw {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #a8a29e;
      border: 2px solid #09090b;
      box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.45);
    }
    #screw-tl {
      left: 14px;
      top: 14px;
    }
    #screw-tr {
      right: 14px;
      top: 14px;
    }
    #screw-bl {
      left: 14px;
      bottom: 14px;
    }
    #screw-br {
      right: 14px;
      bottom: 14px;
    }

    /* 3. Placar Metálico Industrial abaixo da chapa à direita */
    #hud-score-card {
      position: absolute;
      top: 344px;
      right: 76px;
      min-width: 410px;
      height: 102px;
      background-color: #181615;
      background-image: linear-gradient(180deg, #262321 0%, #141211 100%);
      border: 4px solid #78716c;
      border-radius: 14px;
      box-shadow: 0 8px 0 #09090b, 0 14px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      gap: 24px;
    }
    #hud-score-label {
      color: #e7e5e4;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #hud-score-val {
      display: inline-block;
      color: #4ade80;
      font-family: var(--font-mono);
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    /* 4. Card CTA Final (opcional — ativado somente quando --cta é usado) */
    #hud-cta-modal {
      position: absolute;
      left: 110px;
      top: 860px;
      width: 860px;
      background-color: #181615;
      border: 5px solid #fbbf24;
      border-radius: 20px;
      box-shadow: 0 12px 0 #09090b, 0 24px 48px rgba(0, 0, 0, 0.7);
      padding: 32px 40px;
      opacity: 0;
    }
    #hud-cta-eyebrow {
      color: #fbbf24;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #hud-cta-title {
      color: #f8fafc;
      font-size: 46px;
      font-weight: 900;
      line-height: 1.12;
      margin-bottom: 18px;
    }
    #hud-cta-pill {
      display: inline-block;
      background: #09090b;
      color: #fbbf24;
      border: 2px solid #57534e;
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 800;
      padding: 12px 26px;
      border-radius: 12px;
    }
  </style>

  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
    <div id="vignette" data-layout-ignore></div>

    <div id="hud-watermark" data-layout-ignore>
      <div id="hud-wm-dot">*</div>
      <div id="hud-wm-text" data-var-text="brand">ia-lab.dev</div>
    </div>

    <div id="hud-tape-wrap" data-layout-allow-overflow>
      <div id="hud-paper-strip">
        <div id="hud-led" data-layout-ignore></div>
        <div id="hud-banner-text">1 AGENTE SOZINHO QUEBRA</div>
        <div id="screw-tl" class="hud-screw" data-layout-ignore></div>
        <div id="screw-tr" class="hud-screw" data-layout-ignore></div>
        <div id="screw-bl" class="hud-screw" data-layout-ignore></div>
        <div id="screw-br" class="hud-screw" data-layout-ignore></div>
      </div>
    </div>

    <div id="hud-score-card">
      <div id="hud-score-label">ALUCINAÇÕES</div>
      <div id="hud-score-val">0</div>
    </div>

    <div id="hud-cta-modal">
      <div id="hud-cta-eyebrow">BLUEPRINT COMPLETO</div>
      <div id="hud-cta-title">ACESSO AO SISTEMA</div>
      <div id="hud-cta-pill">&gt; /ia-lab</div>
    </div>
  </div>

  <script>
    (function () {
      const DUR = 12;
      const THEME = "amber"; // "amber" | "clean-lab" | "olive-copper" | "obsidian-mint"
      const SHOW_WATERMARK = false;
      const WATERMARK_TEXT = "ia-lab.dev";
      const tl = gsap.timeline({ paused: true });

      if (SHOW_WATERMARK) {
        tl.set("#hud-watermark", { display: "flex" }, 0);
        tl.set("#hud-wm-text", { textContent: WATERMARK_TEXT }, 0);
      } else {
        tl.set("#hud-watermark", { display: "none" }, 0);
      }

      const HUD_THEMES = {
        amber: {
          stripBg: "linear-gradient(180deg, #292524 0%, #171514 100%)",
          stripColor: "#1c1917",
          stripBorder: "#78716c",
          bannerText: "#f8fafc",
          scoreBg: "linear-gradient(180deg, #262321 0%, #141211 100%)",
          scoreColor: "#181615",
          scoreBorder: "#78716c",
          scoreLabel: "#e7e5e4",
          dotBg: "#fbbf24",
          dotFg: "#141414",
        },
        "clean-lab": {
          stripBg: "linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%)",
          stripColor: "#f1f5f9",
          stripBorder: "#1e293b",
          bannerText: "#0f172a",
          scoreBg: "linear-gradient(180deg, #1e293b 0%, #0f172a 100%)",
          scoreColor: "#162032",
          scoreBorder: "#f97316",
          scoreLabel: "#f8fafc",
          dotBg: "#f97316",
          dotFg: "#ffffff",
        },
        "olive-copper": {
          stripBg: "linear-gradient(180deg, #243027 0%, #131a15 100%)",
          stripColor: "#18211b",
          stripBorder: "#b45309",
          bannerText: "#f8fafc",
          scoreBg: "linear-gradient(180deg, #1f2a22 0%, #101612 100%)",
          scoreColor: "#161e18",
          scoreBorder: "#b45309",
          scoreLabel: "#e7e5e4",
          dotBg: "#d97706",
          dotFg: "#ffffff",
        },
        "obsidian-mint": {
          stripBg: "linear-gradient(180deg, #222228 0%, #111115 100%)",
          stripColor: "#16161b",
          stripBorder: "#52525b",
          bannerText: "#f8fafc",
          scoreBg: "linear-gradient(180deg, #1e1e24 0%, #0e0e12 100%)",
          scoreColor: "#141418",
          scoreBorder: "#10b981",
          scoreLabel: "#e4e4e7",
          dotBg: "#10b981",
          dotFg: "#06140e",
        },
      };

      const ht = HUD_THEMES[THEME] || HUD_THEMES.amber;
      tl.set(
        "#hud-paper-strip",
        { backgroundImage: ht.stripBg, backgroundColor: ht.stripColor, borderColor: ht.stripBorder },
        0
      );
      tl.set("#hud-banner-text", { color: ht.bannerText }, 0);
      tl.set(
        "#hud-score-card",
        { backgroundImage: ht.scoreBg, backgroundColor: ht.scoreColor, borderColor: ht.scoreBorder },
        0
      );
      tl.set("#hud-score-label", { color: ht.scoreLabel }, 0);
      tl.set("#hud-wm-dot", { backgroundColor: ht.dotBg, color: ht.dotFg }, 0);

      // Normaliza qualquer cor passada para versões LED de alto contraste WCAG AA
      function toLedColor(c) {
        const s = String(c || "").toLowerCase();
        if (s.includes("c92a2a") || s.includes("e74c3c") || s.includes("ef4444") || s.includes("ff")) return "#ff6b6b";
        if (s.includes("18864b") || s.includes("2ecc71") || s.includes("22c55e") || s.includes("4ade80")) return "#4ade80";
        if (s.includes("b45309") || s.includes("f39c12") || s.includes("f59e0b") || s.includes("fbbf24")) return "#fbbf24";
        return "#38bdf8";
      }

      // Helpers de HUD presos às âncoras da locução
      function setBanner(text, t) {
        tl.fromTo(
          "#hud-paper-strip",
          { scale: 0.95, y: -6 },
          { scale: 1, y: 0, duration: 0.22, ease: "back.out(2.2)" },
          t
        );
        tl.set("#hud-banner-text", { textContent: text }, t);
      }

      function setScore(label, val, colorHex, t) {
        const led = toLedColor(colorHex);
        tl.set("#hud-score-label", { textContent: label }, t);
        tl.set("#hud-score-val", { textContent: String(val), color: led }, t);
        tl.set("#hud-led", { backgroundColor: led, boxShadow: "0 0 16px " + led }, t);
        tl.fromTo(
          "#hud-score-val",
          { scale: 1.35 },
          { scale: 1, duration: 0.26, ease: "back.out(2.4)" },
          t
        );
      }

      // Cena 1 (0.0s - 3.5s): Gancho + Tentativa Ingênua
      tl.set("#hud-banner-text", { textContent: "1 AGENTE SOZINHO QUEBRA" }, 0);
      tl.set("#hud-score-label", { textContent: "ALUCINAÇÕES" }, 0);
      tl.set("#hud-score-val", { textContent: "0", color: "#4ade80" }, 0);
      tl.set("#hud-led", { backgroundColor: "#4ade80", boxShadow: "0 0 16px #4ade80" }, 0);

      // Cena 2 (3.5s - 7.2s): "Só que..." (Gargalo 1: estoura e alucina)
      setBanner("SÓ QUE ELE NÃO VÊ O ERRO", 3.5);
      setScore("ALUCINAÇÕES", 4, "#ff6b6b", 4.1);
      setScore("ALUCINAÇÕES", 9, "#ff6b6b", 5.8);

      // Cena 3 (7.2s - 9.4s): "Então..." (Entra o Revisor Sênior + Testador)
      setBanner("ENTÃO ENTRA A BANCA", 7.2);
      setScore("ERROS RESTANTES", 2, "#fbbf24", 7.8);
      setScore("ERROS RESTANTES", 0, "#4ade80", 8.8);

      // Cena 4 (9.4s - 12.0s): Veredito Final
      setBanner("CÓDIGO APROVADO PELA BANCA", 9.4);

      tl.set({}, {}, DUR);
      window.__timelines["world"] = tl;

      // ---------- Mundo 3D (Three.js + kit3d.js): função pura de t ----------
      let api = null;
      let lastT = 0;
      const ready = Promise.all([
        import("https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js"),
        import("../assets/kit3d.js"),
        document.fonts.load('900 48px "Inter"'),
        document.fonts.load('700 28px "JetBrains Mono"'),
      ]).then(([THREE, KIT]) => {
        api = buildScene(THREE, KIT);
        api.render(lastT);
      });

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = ready;

      window.addEventListener("hf-seek", (e) => {
        lastT = e.detail.time;
        if (api) api.render(lastT);
        else e.detail.waitUntil(ready);
      });

      function buildScene(THREE, KIT) {
        const { PALETTE, E, seg, shake, createDioramaStage, createBlockAgent, createCodeScreen, createFlowArrow, applyCameraShot } = KIT;
        const stage = createDioramaStage(THREE, document.getElementById("gl"), THEME);
        const { scene, cam, sky, renderer, updateStage } = stage;

        // Monitor industrial central
        const screen = createCodeScreen(THREE, {
          title: "sistema_ia.py",
          lines: [
            "SENHA = '123' # ESQUECIDA",
            "se preco == 0:",
            "  liberar_acesso()",
            "  salvar_pedido()",
          ],
          width: 4.0,
          height: 2.6,
          theme: THEME,
        });
        screen.group.position.set(0, 2.35, -1.8);
        scene.add(screen.group);

        // Droide 1: Coder original (Ciano)
        const coder = createBlockAgent(THREE, {
          role: "coder",
          color: PALETTE.cyan,
          scale: 0.95,
          labelText: "CODER",
        });
        coder.group.position.set(-1.35, 0, 0.85);
        scene.add(coder.group);

        // Droide 2: Revisor Sênior (Laranja Industrial)
        const senior = createBlockAgent(THREE, {
          role: "senior",
          color: 0xf97316,
          scale: 0.95,
          labelText: "SÊNIOR",
        });
        senior.group.position.set(1.35, 0, 0.85);
        scene.add(senior.group);

        // Droide 3: Testador de Capacete (Verde Esmeralda)
        const tester = createBlockAgent(THREE, {
          role: "tester",
          color: 0x10b981,
          scale: 0.92,
          labelText: "TESTER",
        });
        tester.group.position.set(0, 0, 1.75);
        scene.add(tester.group);

        // Seta 3D de pressão/erro
        const errArrow = createFlowArrow(THREE, { color: PALETTE.red, length: 1.5 });
        errArrow.group.position.set(-3.1, 2.3, -1.1);
        scene.add(errArrow.group);

        // Planos de câmera (SHOTS)
        const SHOTS = [
          { a: 0, b: 3.5, p0: [0, 3.6, 9.2], p1: [-0.6, 3.3, 8.2], l0: [0, 1.5, -0.4], l1: [-0.4, 1.5, -0.4], ease: "p2io" },
          { a: 3.5, b: 7.2, p0: [-1.8, 3.3, 8.0], p1: [0.3, 3.5, 8.5], l0: [-0.3, 1.6, -0.8], l1: [0, 1.7, -0.8], ease: "p2io" },
          { a: 7.2, b: 12.01, p0: [1.6, 3.7, 9.0], p1: [0, 4.0, 9.8], l0: [0.1, 1.5, 0], l1: [0, 1.4, 0], ease: "p2out" },
        ];

        function render(t) {
          const isErrorPhase = t >= 3.5 && t < 7.5;
          const isFixPhase = t >= 7.5;

          updateStage(t, isErrorPhase ? 0.85 : 0);

          // Estado da tela de código
          if (t < 3.5) {
            screen.draw("normal", -1, "");
          } else if (t < 7.5) {
            screen.draw("error", 0, "FALHA CRÍTICA");
          } else {
            screen.draw("ok", 3, "APROVADO");
          }

          // Seta de pressão (visível durante o gargalo)
          errArrow.group.visible = t >= 3.5;
          if (isErrorPhase) {
            errArrow.setColor(PALETTE.red);
            errArrow.pulse(t, 14, 0.22);
          } else if (isFixPhase) {
            errArrow.setColor(PALETTE.green);
            errArrow.pulse(t, 6, 0.08);
          }

          // Animação dos droides cápsula
          coder.act(t, isErrorPhase ? "panic" : isFixPhase ? "celebrate" : "type", 0);

          const kSenior = E.backOut(seg(t, 7.2, 7.7));
          senior.group.visible = t >= 7.2;
          senior.group.scale.setScalar(Math.max(0.001, 0.95 * kSenior));
          senior.act(t, "point", 1.7);

          const kTester = E.backOut(seg(t, 7.8, 8.3));
          tester.group.visible = t >= 7.8;
          tester.group.scale.setScalar(Math.max(0.001, 0.92 * kTester));
          tester.act(t, "celebrate", 3.1);

          // Câmera + Shake nos cortes
          const camShake = shake(t, 3.5, 0.14, 0.35) + shake(t, 7.5, 0.12, 0.35);
          applyCameraShot(THREE, cam, sky, SHOTS, t, camShake);

          renderer.render(scene, cam);
        }

        return { render };
      }
    })();
  </script>
</template>
