<!doctype html>
<html
  lang="pt-BR"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Fundo","default":"#0b0f1d"},
    {"id":"paper","type":"color","label":"Papel","default":"#f4efe6"},
    {"id":"ink","type":"color","label":"Tinta","default":"#18181b"},
    {"id":"claude","type":"color","label":"Terracota","default":"#b84a24"},
    {"id":"alert","type":"color","label":"Vermelho","default":"#c92a2a"},
    {"id":"ok","type":"color","label":"Verde","default":"#18864b"},
    {"id":"brand","type":"string","label":"Marca","default":"ia-lab.dev"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0f1d;
        --paper: #f4efe6;
        --ink: #18181b;
        --claude: #b84a24;
        --alert: #c92a2a;
        --ok: #18864b;
        --font-sans: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-sans);
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <!-- Duração = locução. Depois de transcrever: tools/set_duration.py <pasta do vídeo> -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <!-- Mundo 3D (Three.js + kit3d.js) + HUD 2D Paper/Tape + Placar -->
      <div
        id="world"
        data-composition-id="world"
        data-composition-src="compositions/world.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- Legendas: geradas por tools/build_captions.py (estilo label-tag) -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="12"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <!-- Locução -->
      <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-track-index="10" data-volume="1.18"></audio>

      <!-- SFX (assets/sfx/): cada início = momento da imagem + 1 frame − pico do arquivo. Exemplo:
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.9" data-duration="0.57" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-err" class="clip" src="assets/sfx/error.mp3" data-start="4.1" data-duration="1.62" data-track-index="12" data-volume="1.8"></audio>
      -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
